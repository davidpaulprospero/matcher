name: Quick Check

on:
  push:
    branches: [ '**' ]  # All branches
  pull_request:

jobs:
  quick-test:
    name: Quick Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Check Python syntax
      run: |
        python -m py_compile src/*.py
        python -m py_compile src/stages/*.py
        python -m py_compile src/keyword_extractor/*.py
        python -m py_compile src/llm_client/*.py

    - name: Run fast unit tests
      run: |
        python -m pytest tests/test_keyword_extractor/ tests/test_llm_client/ tests/test_vision.py -v --tb=short --maxfail=3

    - name: Test summary
      if: always()
      run: |
        echo "✅ Quick check completed"
        echo "Run full test suite: python -m pytest tests/ -v"
