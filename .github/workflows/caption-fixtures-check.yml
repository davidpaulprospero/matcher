name: Caption Fixtures Health Check

# Run weekly and allow manual trigger
on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-fixtures:
    name: Check Video Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp

    - name: Run caption fixtures health check
      id: check
      run: |
        python scripts/check_caption_fixtures.py --verbose --output fixture_report.json
      continue-on-error: true

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fixture-report
        path: fixture_report.json

    - name: Check results
      if: steps.check.outcome == 'failure'
      run: |
        echo "::warning::Some video fixtures need attention. Check the fixture_report.json artifact for details."
        echo "See tests/test_caption_integration.py VIDEO_FIXTURES for fixture definitions."
        exit 1
