name: Benchmarks

on:
  # Weekly scheduled run
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC

  # On benchmark file changes
  push:
    branches: [main]
    paths:
      - 'tests/benchmarks/**'
      - 'scripts/benchmark_runner.py'
      - '.github/workflows/benchmarks.yml'

  # Manual trigger
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update baseline with new results'
        required: false
        default: 'false'
        type: boolean
      threshold:
        description: 'Regression threshold percentage (default: 20)'
        required: false
        default: '20'
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-benchmark-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-benchmark-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark
        pip install -r requirements.txt

    - name: Download baseline (if exists)
      uses: actions/download-artifact@v4
      with:
        name: benchmark-baseline
        path: tests/benchmarks/
      continue-on-error: true

    - name: Run benchmarks
      id: benchmark
      run: |
        # Run benchmarks and save results
        python scripts/benchmark_runner.py \
          --output benchmark-results.json \
          --min-rounds 5 \
          --verbose

        # Check if baseline exists and compare with 20% threshold
        if [ -f tests/benchmarks/baseline.json ]; then
          echo "Comparing against baseline with 20% threshold..."
          THRESHOLD="${{ github.event.inputs.threshold || '20' }}"
          python scripts/benchmark_runner.py \
            --compare-baseline \
            --threshold 0.${THRESHOLD} \
            --output benchmark-results.json || echo "regression_detected=true" >> $GITHUB_OUTPUT
        else
          echo "No baseline found, skipping comparison"
        fi

    - name: Create regression warning
      if: steps.benchmark.outputs.regression_detected == 'true'
      run: |
        echo "::warning title=Benchmark Regression::Performance regression detected! Check benchmark results for details."

    - name: Update baseline (manual trigger)
      if: github.event.inputs.update_baseline == 'true'
      run: |
        # Update baseline with confirmation skipped (CI mode)
        # Current baseline is automatically archived to baseline_history/
        python scripts/benchmark_runner.py \
          --update-baseline \
          --yes \
          --min-rounds 10
        echo "Baseline updated! Previous baseline archived to baseline_history/"

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ github.run_number }}
        path: benchmark-results.json
        retention-days: 90

    - name: Upload baseline (if updated or new)
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-baseline
        path: tests/benchmarks/baseline.json
        retention-days: 365
      if: github.event.inputs.update_baseline == 'true' || !contains(steps.benchmark.outputs.*, 'baseline')

    - name: Post benchmark summary
      run: |
        echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f benchmark-results.json ]; then
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat benchmark-results.json | python -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:v for k,v in d.items() if k != 'benchmarks'}, indent=2))"  >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Benchmarks run: $(cat benchmark-results.json | python -c 'import sys,json; print(len(json.load(sys.stdin).get(\"benchmarks\", {})))')" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ steps.benchmark.outputs.regression_detected }}" == "true" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Regression Detected!** Performance regression exceeds threshold." >> $GITHUB_STEP_SUMMARY
        fi
