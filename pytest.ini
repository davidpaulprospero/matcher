[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
norecursedirs = tests/benchmarks_broken

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short

# Markers
markers =
    fast: marks tests as fast unit tests (<30s total) - run on every commit
    integration: marks tests as integration tests (<2min total) - run on PR merge
    stress: marks tests as stress/chaos tests (unlimited) - run nightly
    simulation: marks tests as healing simulation tests (<5min total) - run on PR merge
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_api: marks tests that require API keys
    requires_network: marks tests that require network access

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning:google.api_core._python_version_support
    ignore:The NumPy module was reloaded:UserWarning
