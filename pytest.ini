[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Add project root to sys.path so 'from src.X import Y' works
pythonpath = .
norecursedirs = tests/benchmarks_broken tests/benchmarks_archived .hypothesis

# Output options
# Note: -n auto is commented out for local development (faster startup)
# CI uses -n auto explicitly. Enable locally with: pytest -n auto
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    # -n auto  # Uncomment for parallel execution locally

# Flaky test handling (pytest-rerunfailures)
# Tests marked @pytest.mark.flaky are retried up to 2 times
# Use --reruns 0 to disable retries during debugging

# Markers
markers =
    fast: marks tests as fast unit tests (<30s total) - run on every commit
    integration: marks tests as integration tests (<2min total) - run on PR merge
    stress: marks tests as stress/chaos tests (unlimited) - run nightly
    simulation: marks tests as healing simulation tests (<5min total) - run on PR merge
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_api: marks tests that require API keys
    requires_network: marks tests that require network access
    flaky: marks tests as flaky (intermittent failures due to timing, network, or race conditions) - auto-retried 2x
    serial: marks tests that must run serially (not in parallel with xdist) due to shared state or os.chdir usage

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning:google.api_core._python_version_support
    ignore:The NumPy module was reloaded:UserWarning
