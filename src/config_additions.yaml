# =============================================================================
# ENHANCED PIPELINE CONFIGURATION
# =============================================================================
# Add these sections to your config.yaml

# -----------------------------------------------------------------------------
# CONFIDENCE ENFORCEMENT
# -----------------------------------------------------------------------------
# Require minimum confidence for matches, remix keywords if below threshold

confidence_enforcement:
  enabled: true
  min_confidence: 0.90        # 90% minimum confidence
  max_retries: 3              # Maximum remix attempts per keyword
  remix_low_confidence: true  # Remix keywords for low-confidence matches
  remix_zero_downloads: true  # Remix keywords with 0 results

# -----------------------------------------------------------------------------
# STOCK FOOTAGE SOURCES
# -----------------------------------------------------------------------------
# Additional sources beyond YouTube

stock_footage:
  pexels:
    enabled: true
    per_keyword: 2            # Videos to download per keyword
    min_duration: 5           # Minimum duration in seconds
    max_duration: 60          # Maximum duration in seconds
    min_height: 720           # Minimum resolution
    output_subdir: "stock"    # Subdirectory for stock footage
  
  pixabay:
    enabled: true
    per_keyword: 2
    min_duration: 5
    max_duration: 60
    min_height: 720
    output_subdir: "stock"

# -----------------------------------------------------------------------------
# IMAGE DOWNLOADS
# -----------------------------------------------------------------------------
# Download high-resolution images for B-roll stills

image_downloads:
  enabled: true
  per_keyword: 2
  min_size_mb: 1.0            # Minimum file size (skip small images)
  sources:
    - pexels
    - pixabay
    - unsplash                 # Requires UNSPLASH_API_KEY
  output_subdir: "images"

# -----------------------------------------------------------------------------
# MULTI-STYLE OTIO
# -----------------------------------------------------------------------------
# Generate multiple timelines with different settings

multi_style_otio:
  enabled: true
  
  # Style 1: Always use default settings
  style_1:
    name: "default"
    description: "Standard matching with balanced settings"
    # Uses main config settings
  
  # Style 2: Alternative settings (can be changed via prompt)
  style_2:
    name: "strict"
    description: "High confidence, fewer alternatives"
    confidence_threshold: 0.70
    num_alternatives: 1
    include_strategy_tracks: false
    prefer_stock_footage: false
  
  # Available presets for style_2:
  # - strict: High confidence, fewer alternatives
  # - stock_heavy: Prefer Pexels/Pixabay footage
  # - fast_paced: Shorter clips, faster cutting
  # - cinematic: Longer clips, slower pace
  # - custom: Configure manually via prompt
  
  prompt_before_download: true  # Ask for style 2 configuration before downloading

# -----------------------------------------------------------------------------
# OTIO TRACK ASSIGNMENTS
# -----------------------------------------------------------------------------
# Separate tracks for different content types

track_assignments:
  youtube_footage: "V1"         # Primary track
  stock_footage: "V_Stock"      # Pexels/Pixabay footage
  images: "V_Images"            # Still images
  alternatives: ["V2", "V3"]    # Alternative matches
  strategies: ["V4", "V5", "V6", "V7", "V8"]  # Strategy tracks
  voiceover: "A_VO"             # Voiceover audio

# -----------------------------------------------------------------------------
# API KEYS (add to .env file)
# -----------------------------------------------------------------------------
# Required for stock footage:
#   PEXELS_API_KEY=your_key_here     # Get at https://www.pexels.com/api/
#   PIXABAY_API_KEY=your_key_here    # Get at https://pixabay.com/api/docs/
#   UNSPLASH_API_KEY=your_key_here   # Get at https://unsplash.com/developers
