# Board Registry — single source of truth for all Trello board configurations.
# The unified autorunner reads this file instead of per-board CLI flags.
#
# To add a new board:
#   1. Create <board_key>/board_channel_map.yaml with Trello board IDs
#   2. Create <board_key>/accounts/<user>.env with TRELLO_API_KEY + TRELLO_TOKEN
#   3. Add an entry below
#   4. Run: python scripts/degold_autorun.py --unified --board <key> --once --dry-run

schema_version: "1.0.0"

defaults:
  skip_discord_prepare: true
  refresh_lipsync: true

boards:
  degold:
    display_name: "Degold"
    enabled: true
    priority: 10
    state_file: "clients/degold/pipeline_queue_state.json"
    accounts_dir: "clients/degold/accounts"
    board_map_file: "clients/degold/board_channel_map.yaml"
    projects_root: null
    channels: []
    skip_discord_prepare: false
    refresh_lipsync: true

  stu:
    display_name: "STU / NEW AMERICA"
    enabled: true
    priority: 5
    state_file: "clients/stu/pipeline_queue_state.json"
    accounts_dir: "clients/stu/accounts"
    board_map_file: "clients/stu/board_channel_map.yaml"
    projects_root: "projects/Stu"
    channels: ["STU"]
    skip_discord_prepare: true
    refresh_lipsync: false

  samples:
    display_name: "Samples"
    enabled: true
    priority: 15
    state_file: "clients/samples/pipeline_queue_state.json"
    accounts_dir: "clients/samples/accounts"
    board_map_file: "clients/samples/board_channel_map.yaml"
    projects_root: null
    channels: ["SAMPLES"]
    skip_discord_prepare: true
    refresh_lipsync: false
