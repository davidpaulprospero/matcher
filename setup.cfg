[mutmut]
# Mutation testing configuration for mutmut
# See: https://mutmut.readthedocs.io/

# Paths to mutate (source modules)
paths_to_mutate =
    src/matching/scoring.py
    src/matching/similarity.py

# Test runner command
runner = pytest tests/test_matching*.py -x -q --tb=no

# Tests directory
tests_dir = tests/

# Dictionary mutations can cause issues with config objects
# Skip dictionary key mutations by default
dict_synonyms = Struct, NamedStruct

# Mutation operators to include
# By default mutmut uses: sdl (statement deletion), aor (arithmetic operator),
# bcr (boolean constant replacement), obr (operator boundary)

# Paths to exclude from mutation
paths_to_exclude =
    src/matching/__pycache__
    src/matching/tests

# Backup directory for mutated files
backup = .mutmut-backup

[flake8]
# Optional: flake8 configuration if needed
max-line-length = 120
exclude = .git,__pycache__,.mutmut-cache,.mutmut-backup

[coverage:run]
# Coverage configuration (works alongside mutation testing)
source = src
omit =
    src/tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
