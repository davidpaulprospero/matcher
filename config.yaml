# =============================================================================
# MATCHER-ALT CONFIGURATION v3.0
# =============================================================================
#
# Chain-of-thought: Centralized config for media matching pipeline
# Reasoning: Single source of truth reduces maintenance and improves consistency
# Decision: 2-space indentation with max 5-level nesting for LLM readability
#
# Usage:
#   from src.config import load_config, get_config
#   config = load_config("config.yaml")
#   threshold = config.matching.min_confidence
#
# Performance: CSafeLoader enables <100ms config loading
# =============================================================================

# -----------------------------------------------------------------------------
# PROJECT IDENTIFICATION
# -----------------------------------------------------------------------------
project:
  name: matcher-alt
  version: 3.0.0
  description: AI-powered voiceover-to-footage matching pipeline

project_dir: "."

# -----------------------------------------------------------------------------
# SHARED DEFAULTS (YAML Anchors for DRY configuration)
# -----------------------------------------------------------------------------
# Chain-of-thought: Repeated values should use anchors to ensure consistency
# Reasoning: Single point of change, reduces errors
# Decision: Define common patterns here, reference with aliases below

defaults:
  # API retry settings
  api_retry: &api_retry
    max_retries: 3
    retry_delay: 2.0
  
  # Quality thresholds
  quality: &quality_defaults
    min_confidence: 0.6
    high_confidence: 0.85
    low_confidence: 0.5
  
  # Rate limiting
  rate_limit: &rate_limit
    request_interval: 0.5
    max_requests_per_minute: 60

# -----------------------------------------------------------------------------
# TRANSCRIPTION (faster-whisper)
# -----------------------------------------------------------------------------
# Chain-of-thought: GPU acceleration critical for performance
# Reasoning: Parallel audio extraction (CPU) + sequential GPU transcription
# Decision: max_workers=4 balances CPU parallelism with memory usage

transcription:
  provider: faster-whisper
  
  # Model selection - larger = more accurate but slower
  # Options: tiny, base, small, medium, large, large-v2, large-v3
  model: base
  language: en
  
  # GPU settings
  # Chain-of-thought: GPU much faster but requires CUDA
  # Reasoning: compute_type=auto lets faster-whisper choose optimal
  use_gpu: true
  compute_type: auto  # auto, float16, int8, float32
  
  # Parallel processing
  # Chain-of-thought: CPU can extract audio in parallel
  # Reasoning: GPU transcription must be sequential (shared model)
  max_workers: 4
  batch_size: 10
  
  # Voice Activity Detection
  # Chain-of-thought: VAD skips silence, improves accuracy FOR VOICEOVER
  # WARNING: VAD can be too aggressive for YouTube videos with varying audio quality
  # Recommendation: Set to false for YouTube downloads, true only for voiceover
  vad_filter: false  # Changed from true - YouTube videos have inconsistent audio quality
  min_silence_duration_ms: 200
  speech_pad_ms: 10
  
  # Segment splitting (for voiceover optimization)
  # Splits long segments at sentence boundaries for better matching
  split_threshold_multiplier: 1.5  # Split if > multiplier * median
  long_median_threshold: 8.0  # If median > this, use absolute threshold
  absolute_split_threshold: 12.0  # Absolute threshold for very long segments
  min_split_duration: 4.0  # Minimum duration to consider splitting
  
  # Pause-based splitting (more aggressive, for natural pauses)
  # Detects silences between SRT segments and splits at natural breaks
  pause_split:
    enabled: true  # Enable pause-based splitting
    min_gap_ms: 500  # Minimum gap between SRT segments to consider a pause (ms)
    split_at_sentences: true  # Split at sentence boundaries (. ! ?) - most aggressive
    split_at_list_markers: true  # Split before "1.", "2.", "8." etc. (countdown patterns)
    split_at_locations: true  # Split at "City, State" patterns
    min_phrase_words: 2  # Minimum words to keep in a segment
    min_segment_duration: 0.5  # Minimum duration for a split segment (seconds)
  
  # Caching
  cache_transcriptions: true
  cache_dir: transcriptions

# -----------------------------------------------------------------------------
# EMBEDDINGS
# -----------------------------------------------------------------------------
# Chain-of-thought: Vector embeddings enable semantic similarity search
# Reasoning: Gemini best quality, local for offline/free usage
# Decision: batch_size=100 optimal for Gemini API limits

embedding:
  # Options: gemini, openai, local, sentence_transformers
  provider: gemini
  
  # Model names per provider
  gemini_model: models/text-embedding-004
  voyage_model: voyage-2
  local_model: all-MiniLM-L6-v2
  
  # Batch processing
  # Chain-of-thought: Batching reduces API calls by 100x
  batch_size: 100
  <<: *api_retry
  
  # Caching
  cache_embeddings: true
  cache_batch_results: true

# -----------------------------------------------------------------------------
# INDEXING (FAISS)
# -----------------------------------------------------------------------------
# Chain-of-thought: Vector index for fast similarity search
# Reasoning: Flat index exact but O(n), IVF approximate but O(sqrt(n))
# Decision: Use flat for <10k vectors, IVF for larger datasets

indexing:
  index_type: flat  # flat, ivf
  use_faiss: true
  
  # IVF settings (only used if index_type is "ivf")
  ivf_nlist: 100   # Number of clusters
  ivf_nprobe: 10   # Clusters to search at query time
  
  # Similarity
  normalize_embeddings: true
  similarity_metric: cosine  # cosine, dot, euclidean

# -----------------------------------------------------------------------------
# VISION PROCESSING
# -----------------------------------------------------------------------------
# Chain-of-thought: Vision API expensive, use selectively
# Reasoning: Only process scenes where transcript is sparse
# Decision: coverage_threshold=0.3 means skip if >30% transcribed

vision:
  provider: gemini
  model: gemini-2.0-flash
  enabled: true
  
  # Selective processing
  # Chain-of-thought: Skip vision if transcript provides enough context
  min_words_per_scene: 5
  coverage_threshold: 0.3
  max_scenes_per_video: 50
  
  # Frame extraction
  frame_format: jpg
  frame_quality: 85
  
  # Cost management
  max_api_calls_per_run: 100
  estimated_cost_per_call: 0.001

# -----------------------------------------------------------------------------
# SCENE DETECTION (PySceneDetect)
# -----------------------------------------------------------------------------
# Chain-of-thought: Scene boundaries enable granular clip selection
# Reasoning: Presets balance speed vs accuracy for different use cases
# Decision: "balanced" default, "fast" for preview, "accurate" for final

scene_detection:
  enabled: true
  preset: balanced  # fast, balanced, accurate
  
  # Individual settings (can override preset)
  threshold: 27.0
  min_scene_len: 15  # frames
  downscale_factor: 4
  frame_skip: 2
  
  # Minimum video duration to process (seconds, 0 = no minimum)
  min_video_duration: 0
  
  # Audio analysis integration
  audio_analysis: true
  silence_threshold_db: -40.0
  min_silence_duration: 0.3
  
  # Hardware acceleration
  use_gpu: true
  force_gpu: false

  # Face detection per scene (B-roll identification)
  # Analyzes each scene for faces to identify B-roll footage
  detect_faces_per_scene: true  # Enable scene-level face detection
  face_sample_frames: 3  # Frames to sample per scene

# -----------------------------------------------------------------------------
# AUDIO ANALYSIS (librosa)
# -----------------------------------------------------------------------------
audio_analysis:
  enabled: true
  sample_rate: 22050
  
  # Silence detection
  silence_threshold_db: -40.0
  min_silence_duration: 0.3
  
  # Speech detection
  speech_threshold: 0.5
  min_speech_duration: 0.2

# -----------------------------------------------------------------------------
# MATCHING ENGINE
# -----------------------------------------------------------------------------
# Chain-of-thought: Two-stage matching optimizes cost vs quality
# Reasoning: Embedding search cheap (FAISS), LLM expensive
# Decision: Retrieve 20 candidates → rerank top 5 with LLM

matching:
  # Confidence thresholds (using shared defaults)
  <<: *quality_defaults
  
  # Clip reuse prevention
  # Chain-of-thought: Prevent same clip appearing multiple times
  # Reasoning: Variety improves viewer experience
  max_clip_reuse: 1
  reuse_penalty: 0.5

  # Global clip deduplication (hard block mode)
  # Chain-of-thought: Same clip should NEVER appear twice anywhere in timeline
  # Reasoning: Prevents exact duplicate footage across segments and tracks
  clip_hard_block: true  # Each clip can only appear once in entire timeline

  # Source file reuse prevention
  # Chain-of-thought: Prevent over-reliance on single video file
  # Reasoning: One video shouldn't dominate the timeline
  max_source_file_reuse: 3  # 0 = unlimited, 3 = max 3 clips from same video
  source_file_penalty: 0.05  # Penalty per use after reaching half the max

  # Two-stage matching optimization
  # Chain-of-thought: FAISS retrieval is O(1), LLM reranking is expensive
  # Reasoning: Cast wide net with embeddings, refine with LLM
  # Note: Need 75+ candidates for V1-V6 (6 unique video files)
  embedding_candidates: 75  # Retrieve from FAISS
  llm_rerank_candidates: 8  # Send to LLM
  
  # Duration scoring
  # Chain-of-thought: Extreme speed changes look unnatural
  # Reasoning: Penalize clips requiring >1.5x or <0.7x speed
  ideal_speed_min: 0.85
  ideal_speed_max: 1.15
  soft_speed_min: 0.70
  soft_speed_max: 1.50
  duration_penalty_factor: 0.1
  
  # Keyword/entity boosting
  keyword_boost: 0.05
  entity_boost: 0.08
  
  # LLM providers (tiered: primary → secondary → local)
  # Chain-of-thought: Fallback chain ensures reliability
  # Reasoning: Gemini fast/cheap, Claude for ambiguous, Ollama offline
  # Options: gemini, anthropic, local, embedding_only
  primary_provider: gemini
  secondary_provider: anthropic
  local_provider: ollama
  
  # Model names
  gemini_model: gemini-2.0-flash
  anthropic_model: claude-3-haiku-20240307
  ollama_model: llama3.2
  ollama_host: http://localhost:11434
  
  # Caching
  cache_llm_responses: true
  cache_ttl_hours: 24

  # Delta matching (only match new videos)
  # Chain-of-thought: Avoid re-matching unchanged videos
  # Reasoning: Saves time when adding new videos to existing project
  delta_matching_enabled: true  # Enable delta-aware matching
  force_rematch: false  # Force rematch all videos (set via CLI --force-rematch)
  rematch_improvement_threshold: 0.05  # Re-evaluate if new video potentially 5% better

  # Chapter/topic matching
  # Chain-of-thought: Match videos based on topic relevance to voiceover chapters
  # Reasoning: Prevents matching Dallas videos to Boise narration
  chapter_matching_enabled: true  # Enable chapter-based topic filtering
  topic_mismatch_penalty: 0.15  # Confidence reduction for topic mismatch (0.0-0.5)
  extract_video_topics: true  # Extract topics from video transcripts using LLM
  min_topic_overlap: 1  # Minimum matching topic keywords required

  # B-roll preference (scene-level face detection)
  # Chain-of-thought: B-roll (no faces) is more useful for matching to narration
  # Reasoning: Talking heads from news/interviews don't fit narration well
  # Decision: When topic matches, boost scenes without faces
  prefer_broll_when_topic_matches: true  # Enable B-roll preference when topic matches
  broll_face_threshold: 0.3  # face_score < this = B-roll (0.0=no faces, 1.0=all faces)
  broll_boost: 0.2  # Confidence boost for matching B-roll (+20%)

  # Location-aware matching (for travel/location content)
  # Chain-of-thought: Travel/location videos need geographic context matching
  # Reasoning: "Paris" in script should match Paris, France footage, not Paris, Texas
  # Decision: Hard filter by country, soft fallback when too strict
  location_matching:
    enabled: true  # Enable location-aware matching for geographic content
    geonames_username: ""  # Or set GEONAMES_USERNAME in .env (free account at geonames.org)
    hard_filter_level: "city"  # "city", "state", "country", or "continent" - filter strictness
    geographic_penalty: 0.4  # Penalty for wrong location in soft fallback mode (0.0-1.0)
    hierarchy_bonus: 0.15  # Bonus for parent/child match (France video for Paris chapter)
    landmark_bonus: 0.2  # Bonus when landmark detected in video
    use_llm_disambiguation: true  # Use LLM to resolve ambiguous locations (Paris FR vs TX)
    cache_dir: ".cache/locations"  # Cache geocoding results

# -----------------------------------------------------------------------------
# KEYWORD EXTRACTION
# -----------------------------------------------------------------------------
keyword:
  provider: gemini  # gemini, anthropic, tfidf
  
  # Extraction settings
  max_keywords: 30
  min_keyword_length: 3
  
  # List-based keyword detection
  # Detects numbered lists (e.g., "Number 10 Austin, Texas") and ensures
  # each list item gets a guaranteed download keyword
  list_detection:
    enabled: true  # Enable list item detection
    download_first: true  # Download list item keywords before general keywords
    skip_if_entity_covered: true  # Skip if already in entity extraction
    keyword_suffix: "footage"  # Suffix for generated keywords (e.g., "Austin Texas footage")

# -----------------------------------------------------------------------------
# NEGATIVE MATCHING (What NOT to match)
# -----------------------------------------------------------------------------
negative_matching:
  enabled: true
  rules:
    - "Don't match talking head shots to action narration"
    - "Don't match static images to dynamic narration"
    - "Avoid matching unrelated b-roll to specific statements"

# -----------------------------------------------------------------------------
# ZERO-DOWNLOAD KEYWORD REMIX
# -----------------------------------------------------------------------------
# Enables filtering/remixing of downloaded videos based on keyword relevance
# before transcription, without additional downloads.
# Triggered after initial batch downloads complete.
# Controls REMIX pipeline stage (keyword-based video filtering).

remix:
  enabled: true  # Controls REMIX stage (filters videos before transcription)
  trigger_after_download: true
  
  # Scoring thresholds
  min_relevance_score: 0.1     # Minimum score to include (0.0-1.0)
  high_relevance_threshold: 0.5  # Score for "high relevance" label
  
  # Processing limits
  max_files_to_process: 500    # Maximum videos to scan
  max_files_to_include: 100    # Maximum videos to pass to transcription
  
  # Matching settings
  fuzzy_match: true            # Allow partial keyword matches
  case_sensitive: false
  
  # Interactive mode
  interactive_curation: true   # Ask user to confirm remix
  show_excluded: true          # Show which files were excluded
  
  # Auto-accept filter (set upfront, skip mid-pipeline prompt)
  # Options: "filtered" (use filtered), "all" (use all videos), "prompt" (ask during pipeline)
  auto_accept_filter: all
  
  # Logging
  log_level: INFO
  log_file_processing: false   # Log each file (verbose)
  
  # Performance
  parallel_scoring: true
  max_workers: 4
  
  # Entity extraction
  # Chain-of-thought: Named entities get priority in searches
  # Reasoning: "Tokyo" more specific than "city"
  extract_entities: true
  entity_types:
    - PERSON
    - GPE      # Geo-political entity (city, country)
    - ORG
    - DATE
    - EVENT
  
  # TF-IDF fallback
  use_tfidf_weights: true
  tfidf_max_features: 100
  
  # Footage suffixes
  # Chain-of-thought: Adding "footage" improves YouTube search relevance
  add_footage_suffixes: true
  footage_suffixes:
    - 4K footage
    - news footage
    - drone footage
    - aerial footage
    - stock footage
    - documentary footage
  
  batch_size: 50

# -----------------------------------------------------------------------------
# ZERO-DOWNLOAD KEYWORD REMIX
# -----------------------------------------------------------------------------
# Chain-of-thought: When a keyword returns 0 downloads, use LLM to generate alternatives
# Reasoning: Specific keywords like "Wichita Kansas fentanyl 2024" may not exist on YouTube
# Decision: Automatically broaden/rephrase failed keywords and retry

zero_download_remix:
  enabled: true
  max_retries: 2           # Maximum remix attempts per batch
  use_llm: true            # Use LLM for smart remixing (Gemini/Claude)
  use_fallback: true       # Use rule-based fallback if LLM fails
  cache_results: true      # Cache remix results to avoid repeated API calls
  min_keywords_to_trigger: 1  # Minimum failed keywords to trigger remix
  max_keywords_per_batch: 20  # Maximum keywords to remix at once

# -----------------------------------------------------------------------------
# IMAGE SEARCH (Entity Stills)
# -----------------------------------------------------------------------------
# Downloads images for entities (people, places, organizations) mentioned
# in the voiceover. Images are placed on V9 track as stills/overlays.
# Controls ENTITY_IMAGES and ENTITY_VIDEOS pipeline stages.

image_search:
  enabled: true  # Controls ENTITY_IMAGES and ENTITY_VIDEOS stages
  
  # Short path settings (like download config)
  # Set root_dir to a short path near drive root for best results
  root_dir: "E:/i"      # Short path for images. Empty = use project_dir/images
  folder_name: "images" # Subfolder name when root_dir is empty
  
  # Images per entity (5 recommended for variety and backup options)
  images_per_entity: 1
  
  # Videos per entity for stock footage (3 recommended)
  videos_per_entity: 1
  
  # Minimum file size in MB (1MB ensures quality)
  min_size_mb: 1.0
  
  # Output directory (DEPRECATED - use root_dir instead)
  output_dir: images
  
  # Search sources (prioritized in order)
  use_google: true       # Google Images (requires: pip install pyimagedl)
  use_bing: false        # Bing Images (disabled - alive_progress conflicts with Google)
  use_stock_apis: true   # Pexels/Pixabay APIs for images AND videos (recommended fallback)
  
  # Entity types to search for
  entity_types:
    - PERSON
    - GPE        # Locations (cities, countries)
    - ORG        # Organizations
    - DATE       # Time periods
    - EVENT      # Named events
  
  # OTIO output settings
  image_track: V9           # Track for image stills (Google Images)
  stock_video_track: V10    # Track for stock videos (Pexels/Pixabay)
  default_duration: 0.0     # 0 = match segment duration
  
  # Download timeouts and limits
  download_timeout: 10       # Seconds per image download
  max_search_time: 300       # Max seconds for entire search per entity (5 minutes)
  max_results_to_check: 500  # Max search results to check per entity
  search_until_found: true   # If true, keeps searching until images_per_entity found (ignores max_results_to_check)
  
  # Stock video settings
  stock_video:
    min_duration: 3.0        # Minimum video duration in seconds
    max_duration: 30.0       # Maximum video duration in seconds
    prefer_hd: true          # Prefer HD quality videos

  # Cross-project entity image caching
  # When enabled, shares downloaded entity images across projects
  entity_cache:
    enabled: true                           # Enable global entity cache
    cache_dir: "~/.matcher_entity_cache"    # Shared cache location (~ = home dir)
    fuzzy_threshold: 0.85                   # Entity name matching threshold (0.0-1.0)
    max_age_days: 0                         # Cache expiration in days (0 = never expire)
    cache_strategy: "copy"                  # copy, symlink, or reference

  # Entity matching settings (V9/V10 track gap control)
  # Controls how entities match to voiceover segments in timeline
  enable_sticky_matching: false        # Reuse last entity when no match (creates continuous blocks)
  semantic_match_threshold: 0.15       # Minimum word overlap for match (0.0-1.0, default 0.15)

# -----------------------------------------------------------------------------
# LLM SETTINGS
# -----------------------------------------------------------------------------
# Chain-of-thought: Centralized LLM settings for keyword extraction and other tasks
# Reasoning: Multiple components need LLM access with consistent settings
# Decision: "google" provider uses Gemini, "anthropic" uses Claude

llm:
  provider: google  # google, anthropic, ollama
  model: gemini-2.0-flash

  # Anthropic specific (used when provider is "anthropic")
  anthropic_model: claude-3-haiku-20240307

  # Ollama specific (used when provider is "ollama")
  ollama_model: llama3.2
  ollama_host: http://localhost:11434

  # Generation settings (legacy compatibility)
  temperature: 0.7
  max_tokens: 2000

  # Retry configuration - unified for all LLM operations
  retry:
    max_retries: 3
    retry_delay_seconds: 2.0
    timeout_seconds: 120
    exponential_backoff: true

  # Cache configuration - unified LLM response caching with TTL
  cache:
    enabled: true
    ttl_hours: 24  # 0 = never expire
    cache_dir: .cache/llm_responses

  # Provider-specific configurations
  gemini:
    model: gemini-2.0-flash
    max_tokens: 2000
    temperature: 0.7

  anthropic:
    model: claude-3-haiku-20240307
    max_tokens: 2000
    temperature: 0.7

  ollama:
    model: llama3.2
    max_tokens: 2000
    temperature: 0.7

  # API keys loaded from environment:
  #   - google/gemini: GEMINI_API_KEY or GOOGLE_API_KEY
  #   - anthropic: ANTHROPIC_API_KEY
  #   - ollama: (no API key required for local models)
  #
  # New in v3.1: Unified LLM client with automatic retry, caching, and JSON parsing
  # See CLAUDE.md Rule 9 for usage examples

# -----------------------------------------------------------------------------
# ENHANCED FEATURES
# -----------------------------------------------------------------------------
# Chain-of-thought: 90% confidence ensures quality output
# Reasoning: Better to flag gaps than use poor matches
# Decision: Enable keyword remix for automatic improvement

enhanced:
  enabled: true  # Controls STOCK stage (generic stock footage)
  min_confidence: 0.90  # 90% minimum target
  max_retries: 3

  # Keyword remix
  remix_enabled: true
  remix_keyword_count: 10

  # Stock footage integration (STOCK stage)
  enable_pexels: true
  enable_pixabay: true
  stock_per_keyword: 2
  
  # User prompts
  confirm_before_download: true
  prompt_enhanced_features: true
  non_interactive: false  # Set to true for fully automated runs (no prompts)
  
  # Face preference for matching
  # Options: neutral (no preference), prefer_faces (boost clips with faces), avoid_faces (penalize faces)
  face_preference: "neutral"

# -----------------------------------------------------------------------------
# DOWNLOADING (yt-dlp)
# -----------------------------------------------------------------------------
# Chain-of-thought: Duration tiers optimize for different content types
# Reasoning: Short clips for B-roll, long for documentary segments
# Decision: Prefer H.264 to avoid VP9/AV1 transcoding overhead

downloading:
  output_dir: downloaded_videos
  organize_by_keyword: true
  
  # Quality settings
  preferred_quality: "1080"
  max_quality: "2160"
  prefer_h264: true
  
  # DaVinci Resolve compatible codecs (no transcode needed)
  davinci_compatible_codecs:
    - h264
    - hevc
    - prores
    - dnxhd
    - dnxhr
  
  # Codecs requiring transcoding
  transcode_codecs:
    - vp9
    - av1
    - vp8
  
  # Transcoding settings
  transcode_codec: h264
  transcode_crf: 18
  use_hw_accel: true
  hw_accel_type: auto  # auto, cuda, amf, qsv, videotoolbox
  
  # Rate limiting
  max_downloads_per_keyword: 10
  download_delay: 1.0
  
  # Checkpointing
  use_checkpoints: true
  checkpoint_file: download_checkpoint.json

# -----------------------------------------------------------------------------
# DOWNLOAD (VideoDownloader settings)
# -----------------------------------------------------------------------------
# Chain-of-thought: VideoDownloader expects config.download with specific attrs
# Reasoning: Matches downloader.py VideoDownloader class expectations
# Decision: Provide all attributes that VideoDownloader uses

download:
  # ==========================================================================
  # SHORT PATH SETTINGS - Critical for NLE compatibility
  # ==========================================================================
  # Windows has 260 char path limit. Long paths cause DaVinci Resolve import issues.
  # These settings keep total path under 80 chars:
  #   E:/v/proj_name/keyword_s/title______xYz12345678.mp4
  #   ^--80 chars max------------------------------------------^
  #
  # Set root_dir to a short path near drive root for best results
  # Example paths with these settings:
  #   root_dir: "E:/v"  →  E:/v/myproject/winter_s/Snow_driv_abc123.mp4 (52 chars)
  #   root_dir: ""      →  D:/Projects/myproject/videos/winter_s/Snow_driv_abc123.mp4 (65 chars)
  
  root_dir: "E:/v"  # Short root path. Examples: "E:/v", "D:/vid", "C:/v"
  folder_name: "videos"  # Subfolder name when root_dir is empty
  max_keyword_len: 6     # Keyword folder: "winter" not "winter_road_conditions"
  max_filename_len: 8    # Filename: "Snow_dri_abc123.mp4" (8 + 11 + 4 = 23 chars)
  
  quality: "1080p"
  format: mp4
  
  # DaVinci Resolve compatibility
  davinci_mode: true
  davinci_codec: h264
  davinci_prores_profile: proxy
  
  # Hardware acceleration
  hw_accel: auto  # auto, cuda, amf, qsv, videotoolbox, none
  hw_quality: high
  
  # Download behavior
  min_views: 0
  delete_original: true
  delay_between_keywords: 1.0
  
  # Title blacklist - skip videos containing these terms (case-insensitive)
  # Useful for filtering out sports highlights, music videos, live streams, etc.
  title_blacklist:
    - "highlights"
    - "basketball"
    - "football"
    - "soccer"
    - "nba"
    - "nfl"
    - "mlb"
    - "nhl"
    - "ufc"
    - "boxing"
    - "wrestling"
    - "vs."
    - "vs "
    - "match"
    - "game recap"
    - "full game"
    - "full match"
    - "sports"
    - "espn"
    - "goals"
    - "touchdowns"
    - "live stream"
    - "livestream"
    - "webcam"
    - "live cam"
    - "24/7"
    - "24 7"
    - "lofi"
    - "lo-fi"
  
  # LLM Title Filter - use AI to check if video titles are relevant
  # This runs BEFORE downloading, saving bandwidth and time
  llm_title_filter:
    enabled: true
    provider: gemini  # gemini (fast) or anthropic (Claude Haiku)
    model: gemini-2.0-flash  # or claude-3-haiku-20240307
    batch_size: 20  # Check 20 titles at once
    min_relevance: 0.5  # 0-1, reject if below this (lower = more permissive)
  
  # YouTube authentication - REQUIRED!
  # YouTube blocks yt-dlp without authentication.
  # 
  # Option 1 (RECOMMENDED): Extract cookies directly from browser
  # Set to: chrome, firefox, edge, brave, opera, vivaldi, safari
  # Note: Browser must be closed for Chrome/Edge. Firefox works while open.
  cookies_from_browser: firefox
  
  # Option 2: Use exported cookies.txt file
  # Export using browser extension: "Get cookies.txt LOCALLY" (Chrome) or "cookies.txt" (Firefox)
  # Leave empty to auto-detect cookies.txt in install/project directory
  cookies_path: ""
  
  # Search pool settings - IMPORTANT for finding matching videos!
  # YouTube search returns limited results, so we search more than we download
  # to find videos that match our duration filters
  search_pool_multiplier: 5  # Search 5x what we want to download
  min_search_pool: 40        # Minimum search pool size
  max_search_pool: 100       # Maximum search pool (for adaptive sizing)
  # Adaptive pool: automatically expands pool for low-pass-rate keywords

  # Timeout settings (seconds)
  search_timeout: 60         # Timeout for search metadata subprocess
  download_timeout: 120      # Default timeout per video download (used for 'short' tier)

  # Tier-specific download timeouts (longer videos need more time)
  download_timeouts:
    short: 120     # 2 min timeout for videos <2 min
    medium: 300    # 5 min timeout for videos 2-10 min
    long: 600      # 10 min timeout for videos 10-25 min
    longer: 900    # 15 min timeout for videos 25-50 min

  # Audio-First Mode - Dramatically reduces download time
  # How it works:
  #   1. Downloads audio only (MP3) first - ~5% of video size
  #   2. Transcribes and matches against voiceover
  #   3. Downloads ONLY the matched video segments with buffer
  # Typical savings: 80-90% less download time/bandwidth
  audio_first:
    enabled: true           # Audio-first mode enabled by default
    buffer_seconds: 30.0    # Extra footage before/after each match
    merge_gap_seconds: 15.0 # Merge segments closer than this (reduces requests)
    audio_quality: 5        # 0 (best) to 9 (worst), 5 = ~128kbps
    fallback_full_video: true      # If segment download fails, download full video
    delete_audio_after_video: false # Keep audio files after video download
    checkpoint_phases: true  # Save checkpoint after each phase

  # Zero-download remix: auto-retry with alternative keywords when 0 results
  # When a keyword returns no videos, automatically try simplified/remixed terms
  zero_download_remix:
    enabled: true           # Enable automatic keyword remix on 0 results
    use_llm: false          # Use LLM for smart remix (costs API calls, slower)
                            # If false, uses simple heuristics (add "footage", simplify)

  # Speech screening: pre-screen videos by transcribing first N seconds
  # Filters out videos with talking heads/commentary to ensure only B-roll footage
  # Only applied to configured tiers (long videos are more likely to have intros)
  speech_screening:
    enabled: true           # Enable speech screening for long videos
    screening_duration: 10.0 # Seconds from start to check for speech (increased for better accuracy)
    min_speech_duration: 1.0 # Minimum speech duration to trigger rejection (stricter threshold)
    reject_with_speech: true # If true, reject videos with speech; if false, just log
    whisper_model: "base"   # Model for screening: tiny, base, small, medium, large
    timeout_per_video: 45   # Timeout per video screening (seconds) - increased for 10s clips
    fallback_on_error: "accept"  # "accept" or "reject" on screening errors
    tiers:                  # Only apply to these duration tiers
      - "long"              # 10-25 min videos
      - "longer"            # 25-50 min videos

  # FFmpeg location (required for segment downloads if not in PATH)
  # Example: "C:/ffmpeg/bin" or leave empty to auto-detect
  ffmpeg_location: "C:/ffmpeg/bin"

# -----------------------------------------------------------------------------
# DURATION TIERS
# -----------------------------------------------------------------------------
# Chain-of-thought: Different video lengths serve different purposes
# Reasoning: Short clips for quick cuts, long for extended coverage

duration_tiers:
  short:
    min: 20
    max: 120
    count: 0            # Disabled - focusing on medium/long videos
    max_total: 0        # 0 = no limit
  medium:
    min: 120
    max: 600
    count: 10            # Increased from 3
    max_total: 0
  long:
    min: 600
    max: 1500
    count: 0            # Increased from 1
    max_total: 0
  longer:
    min: 1500
    max: 3000
    count: 0            # Increased from 1
    max_total: 0        # Removed limit - allow multiple longer videos

# -----------------------------------------------------------------------------
# STOCK FOOTAGE (Pexels, Pixabay)
# -----------------------------------------------------------------------------
stock_footage:
  enabled: true
  pexels_enabled: true
  pixabay_enabled: true
  per_keyword: 3
  min_duration: 5
  max_duration: 60
  min_height: 720
  prefer_landscape: true
  <<: *rate_limit

# -----------------------------------------------------------------------------
# SILENT VIDEO HANDLING (B-ROLL)
# -----------------------------------------------------------------------------
# Chain-of-thought: Silent videos (no speech) are valuable B-roll footage
# Reasoning: They're versatile visual content without talking heads
# Decision: Generate descriptions using Vision API or LLM for matching
silent_video:
  enabled: true  # Enable silent video handling
  min_words_threshold: 10  # Videos with fewer words are considered silent
  use_vision_api: true  # Use Gemini Vision to describe video frames
  use_llm_fallback: true  # Fall back to LLM description from title/keyword
  cache_descriptions: true  # Cache generated descriptions

# -----------------------------------------------------------------------------
# DEDUPLICATION
# -----------------------------------------------------------------------------
# Chain-of-thought: Perceptual hashing detects near-duplicate videos
# Reasoning: Saves storage, prevents redundant processing
# Decision: threshold=10 balances precision vs recall

deduplication:
  enabled: true
  hash_threshold: 10  # Hamming distance (0-64, lower = stricter)
  use_first_frame: true
  auto_delete: true
  generate_report: true
  frame_timeout: 30   # Seconds for FFmpeg frame extraction

# -----------------------------------------------------------------------------
# OUTPUT GENERATION
# -----------------------------------------------------------------------------
# Chain-of-thought: Multiple tracks give editors options
# Reasoning: V1-V3 alternatives, V4-V8 strategies
# Decision: Enable all by default, let editors disable unused

output:
  output_dir: output
  
  # File formats
  generate_otio: true
  split_otio: true  # Split OTIO into multiple files by clip batches
  otio_clips_per_file: 10  # Max clips per OTIO file (lower = smaller files, easier import)
  generate_edl: true
  generate_xml: true  # DaVinci Resolve XML (fallback if OTIO fails)
  xml_parts: 6  # Split XML into multiple files (helps with large projects)
  generate_report: true
  
  # Track structure
  # V1: Primary, V2-V3: Alternatives
  # V4-V6: Secondary (different video files from V1-V3)
  # V7: Embedding-Diversity strategy
  num_alternatives: 2  # V2-V3
  include_strategy_tracks: true
  strategy_tracks:
    - embedding_diversity  # V7 - maximally different clips from V1-V3
    - broll_only           # V8 - B-roll only matching (silent footage)
  
  # Variety enforcement - prevents same source video from dominating timeline
  # This solves the problem of one video being used for 90% of a 30-minute project
  variety:
    require_different_source: true  # Each track must use different source video
    exclude_same_clip: true  # Never use exact same clip on multiple tracks
    min_time_distance: 10.0  # Clips must be N seconds apart (within same source)
    min_embedding_distance: 0.3  # Strategy tracks must have distance > this from V1-V3
    
    # Timeline variety - IMPORTANT for long projects
    # Within timeline_variety_window seconds, same source can only appear max_repeats times
    enforce_timeline_variety: true  # Enable timeline-based variety enforcement
    timeline_variety_window: 300.0  # 5 minutes - no same source within this window
    max_source_repeats_in_window: 2  # Max times same source can appear in window
  
  # Markers
  include_speed_markers: true
  max_recommended_speed: 1.5

# -----------------------------------------------------------------------------
# MULTI-STYLE OUTPUT
# -----------------------------------------------------------------------------
multi_style:
  enabled: false
  styles:
    - default
    - strict

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Chain-of-thought: Comprehensive logging aids debugging and auditing
# Reasoning: Dual output (file + JSON) for human and machine consumption
# Decision: Track API costs for budget management

logging:
  enabled: true
  log_dir: logs
  log_level: INFO  # DEBUG, INFO, WARNING, ERROR
  
  # Output targets
  log_to_file: true
  log_to_console: true
  generate_json_log: true
  
  # Log content
  log_api_calls: true
  log_match_decisions: true
  log_performance: true
  
  # Cost tracking
  track_api_costs: true
  
  # Config debugging
  # Chain-of-thought: Enable to debug which config values are accessed
  log_config_access: false
  warn_on_hardcoded: true

# -----------------------------------------------------------------------------
# CACHE
# -----------------------------------------------------------------------------
cache:
  cache_dir: .cache
  
  # Per-type caching
  cache_transcriptions: true
  cache_embeddings: true
  cache_scenes: true
  cache_llm_responses: true
  cache_vision: true
  
  # Cross-project cache
  cross_project_cache: false
  cross_project_cache_dir: ""
  
  # Validation
  validate_cache_on_load: true
  use_file_hash: true

# -----------------------------------------------------------------------------
# GLOBAL CACHE (Cross-Project Video Reuse)
# -----------------------------------------------------------------------------
# Enables sharing of video cache (transcripts, embeddings, scenes) across
# multiple projects. Videos from past projects can be reused if they match
# the current project's keywords/topics.
#
# Key features:
# - Pre-download check: Find relevant videos before downloading new ones
# - Smart re-download: Re-add deleted videos to download queue
# - Priority system: Current project videos always take precedence

global_cache:
  enabled: true
  cache_dir: "~/.matcher_global_cache"  # ~ expands to home directory

  # Pre-download optimization
  check_before_download: true   # Query cache before downloading new videos
  redownload_deleted: true      # Re-download if cached video file was deleted
  prompt_reuse: true            # Ask user before reusing (false = auto-reuse)

  # Relevance thresholds
  min_keyword_similarity: 0.8   # Fuzzy match threshold for keywords (0-1)
  min_topic_overlap: 0.3        # Minimum topic relevance to consider video (0-1)

  # Limits
  max_reuse_videos: 50          # Max videos to reuse from cache per project
  max_redownload: 10            # Max deleted videos to re-download

  # What to share globally
  share_transcripts: true       # Share video transcripts across projects
  share_embeddings: true        # Share embedding vectors across projects
  share_scenes: true            # Share scene detection data across projects
  share_face_detection: true    # Share face detection scores across projects

  # Priority boost for current project videos in matching
  current_project_boost: 0.1    # How much to boost current project videos (0-1)

# -----------------------------------------------------------------------------
# PIPELINE AUTOMATION
# -----------------------------------------------------------------------------
# Skip stages to re-run pipeline with existing data.
# Useful for: re-matching with different settings, testing output formats, etc.

pipeline:
  # Stage control (set true to skip that stage)
  skip_download: false        # Skip video download - use existing videos
  skip_image_search: false    # Skip entity image search
  skip_transcription: false   # Skip transcription - use cached transcripts
  skip_scene_detection: false # Skip scene detection
  skip_matching: false        # Skip matching stage
  
  # Video source directory (used when skip_download=true)
  # Set to absolute path containing your videos, e.g.:
  # video_source_dir: "E:/Edit Job/test/project/downloaded_videos"
  video_source_dir: ""
  
  # Resume/retry
  resume_enabled: true
  max_retries: 3
  
  # Parallel processing
  parallel_transcription: true
  parallel_embedding: true

# -----------------------------------------------------------------------------
# API KEYS
# -----------------------------------------------------------------------------
# Chain-of-thought: API keys should be in environment variables
# Reasoning: Security - don't commit secrets to version control
# Decision: Document required keys here, load from env vars
#
# Required environment variables:
#   GEMINI_API_KEY      - Google Gemini (LLM, embeddings, vision)
#   ANTHROPIC_API_KEY   - Anthropic Claude (secondary LLM)
#   VOYAGE_API_KEY      - Voyage AI (alternative embeddings)
#   PEXELS_API_KEY      - Pexels stock footage
#   PIXABAY_API_KEY     - Pixabay stock footage
#   UNSPLASH_API_KEY    - Unsplash images
#
# api_keys section is auto-populated from environment variables at runtime