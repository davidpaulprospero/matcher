# =============================================================================
# MATCHER-ALT CONFIGURATION v3.0
# =============================================================================
#
# This is the SINGLE SOURCE OF TRUTH for all configurable settings.
# All components read from this file via config.py.
#
# Structure:
#   - Each section corresponds to a component or feature
#   - Comments explain purpose and valid values
#   - Defaults are sensible for most use cases
#
# Usage:
#   from config import load_config, get_config
#   config = load_config("config.yaml")
#   threshold = config.matching.min_confidence
#
# =============================================================================

# -----------------------------------------------------------------------------
# PROJECT SETTINGS
# -----------------------------------------------------------------------------

project_name: "voiceover_match"
project_dir: "."  # Base directory for relative paths

# -----------------------------------------------------------------------------
# TRANSCRIPTION (faster-whisper)
# -----------------------------------------------------------------------------
# Transcribes voiceover and video audio using Whisper models.
# GPU acceleration via CUDA significantly speeds up processing.

transcription:
  provider: "faster-whisper"  # Only faster-whisper supported currently
  
  # Model selection - larger = more accurate but slower
  # Options: tiny, base, small, medium, large, large-v2, large-v3
  model: "base"
  
  language: "en"  # ISO language code, or "auto" for detection
  
  # GPU settings
  use_gpu: true
  compute_type: "auto"  # auto, float16 (GPU), int8 (CPU), float32
  
  # Parallel processing (CPU-bound audio extraction parallelized)
  max_workers: 4
  batch_size: 10
  
  # Voice Activity Detection - skip silence
  vad_filter: true
  min_silence_duration_ms: 500
  speech_pad_ms: 200
  
  # Caching
  cache_transcriptions: true
  cache_dir: "transcriptions"

# -----------------------------------------------------------------------------
# EMBEDDINGS
# -----------------------------------------------------------------------------
# Vector embeddings for similarity search.
# Gemini recommended for quality, local for offline/free usage.

embedding:
  # Provider: gemini (best), voyage (high quality), local (free/offline)
  provider: "gemini"
  
  # Model names per provider
  gemini_model: "models/text-embedding-004"
  voyage_model: "voyage-2"
  local_model: "all-MiniLM-L6-v2"
  
  # Batch processing (Gemini supports up to 100)
  batch_size: 100
  max_retries: 3
  retry_delay: 2.0
  
  # Caching
  cache_embeddings: true
  cache_batch_results: true

# -----------------------------------------------------------------------------
# INDEXING (FAISS)
# -----------------------------------------------------------------------------
# Vector index for fast similarity search.

indexing:
  # Index type: flat (exact, small datasets), ivf (approximate, large datasets)
  index_type: "flat"
  use_faiss: true
  
  # IVF settings (only used if index_type is "ivf")
  ivf_nlist: 100   # Number of clusters
  ivf_nprobe: 10   # Clusters to search at query time
  
  # Similarity
  normalize_embeddings: true
  similarity_metric: "cosine"  # cosine, dot, euclidean

# -----------------------------------------------------------------------------
# VISION PROCESSING
# -----------------------------------------------------------------------------
# Extracts visual descriptions from video frames.
# Selective processing to minimize API costs.

vision:
  provider: "gemini"
  model: "gemini-2.0-flash"
  enabled: true
  
  # Selective processing - only analyze scenes with sparse transcripts
  min_words_per_scene: 5      # Scenes with fewer words get vision analysis
  coverage_threshold: 0.3     # Skip vision if transcript covers > 30%
  max_scenes_per_video: 50
  
  # Frame extraction
  frame_format: "jpg"
  frame_quality: 85
  
  # Cost management
  max_api_calls_per_run: 100
  estimated_cost_per_call: 0.001

# -----------------------------------------------------------------------------
# SCENE DETECTION (PySceneDetect)
# -----------------------------------------------------------------------------
# Detects scene boundaries in videos for granular matching.

scene_detection:
  enabled: true
  
  # Preset: fast, balanced, accurate
  # Use preset OR specify individual settings below
  preset: "balanced"
  
  # Individual settings (override preset if specified)
  # threshold: 27.0        # Content detection threshold
  # min_scene_len: 15      # Minimum scene length in frames
  # downscale_factor: 4    # Downscale for speed (1 = full res)
  # frame_skip: 2          # Skip frames for speed
  
  # Preset definitions (reference only, don't modify)
  presets:
    fast:
      downscale: 6
      frame_skip: 3
      threshold: 30.0
      min_scene: 20
    balanced:
      downscale: 4
      frame_skip: 2
      threshold: 27.0
      min_scene: 15
    accurate:
      downscale: 2
      frame_skip: 0
      threshold: 25.0
      min_scene: 10
  
  # Audio analysis integration
  audio_analysis: true
  silence_threshold_db: -40.0
  min_silence_duration: 0.3
  
  # Hardware acceleration
  use_gpu: true
  force_gpu: false

# -----------------------------------------------------------------------------
# AUDIO ANALYSIS (librosa)
# -----------------------------------------------------------------------------
# Analyzes audio for silence/speech detection and cut points.

audio_analysis:
  enabled: true
  sample_rate: 22050
  
  # Silence detection
  silence_threshold_db: -40.0
  min_silence_duration: 0.3
  
  # Speech detection
  speech_threshold: 0.5
  min_speech_duration: 0.2
  
  # Spectral features for speech detection
  spectral_centroid_range: [300, 4000]  # Hz range for speech
  spectral_flatness_threshold: 0.3

# -----------------------------------------------------------------------------
# MATCHING ENGINE
# -----------------------------------------------------------------------------
# Core matching logic - pairs voiceover segments with video clips.
# Uses two-stage matching: embedding retrieval → LLM reranking.

matching:
  # Confidence thresholds
  min_confidence: 0.7           # Minimum acceptable match confidence
  high_confidence_threshold: 0.85  # Skip LLM if embedding similarity >= this
  low_confidence_threshold: 0.5    # Use secondary LLM if confidence < this
  
  # Clip reuse prevention
  max_clip_reuse: 1             # Each clip can be used at most N times
  reuse_penalty: 0.5            # Confidence penalty per reuse (50%)
  
  # Two-stage matching optimization
  embedding_candidates: 20      # Retrieve this many from FAISS
  llm_rerank_candidates: 5      # Send top N to LLM for reranking
  
  # Duration scoring - penalize clips requiring extreme speed changes
  ideal_speed_range: [0.85, 1.15]   # No penalty in this range
  soft_speed_range: [0.70, 1.50]    # Soft penalty in this range
  duration_penalty_factor: 0.1
  
  # Keyword/entity boosting
  keyword_boost: 0.05           # Confidence boost for keyword match
  entity_boost: 0.08            # Confidence boost for entity match
  
  # LLM providers (tiered: primary → secondary → local)
  primary_provider: "gemini"
  secondary_provider: "anthropic"
  local_provider: "ollama"
  
  # Model names
  gemini_model: "gemini-2.0-flash"
  anthropic_model: "claude-3-haiku-20240307"
  ollama_model: "llama3.2"
  
  # Caching
  cache_llm_responses: true
  cache_ttl_hours: 24

# -----------------------------------------------------------------------------
# KEYWORD EXTRACTION
# -----------------------------------------------------------------------------
# Extracts search keywords from voiceover for footage retrieval.

keyword:
  provider: "gemini"  # gemini, anthropic, tfidf
  
  # Extraction settings
  max_keywords: 30
  min_keyword_length: 3
  
  # Entity extraction (named entities get priority)
  extract_entities: true
  entity_types:
    - "PERSON"
    - "GPE"      # Geo-political entity (city, country)
    - "ORG"
    - "DATE"
    - "EVENT"
  
  # TF-IDF fallback
  use_tfidf_weights: true
  tfidf_max_features: 100
  
  # Footage suffixes (improve YouTube search relevance)
  add_footage_suffixes: true
  footage_suffixes:
    - "4K footage"
    - "news footage"
    - "drone footage"
    - "aerial footage"
    - "stock footage"
    - "documentary footage"
  
  # Batch processing
  batch_size: 50

# -----------------------------------------------------------------------------
# KEYWORD REMIX
# -----------------------------------------------------------------------------
# Regenerates keywords when matching confidence is below threshold.

keyword_remix:
  enabled: true
  confidence_threshold: 0.9     # Remix if average confidence < this
  max_remix_attempts: 2
  remix_keyword_count: 10       # New keywords to generate per remix

# -----------------------------------------------------------------------------
# DOWNLOADING (yt-dlp)
# -----------------------------------------------------------------------------
# Downloads videos from YouTube and handles codec compatibility.

downloading:
  output_dir: "downloaded_videos"
  organize_by_keyword: true
  
  # Duration tiers - different limits for different video lengths
  # Format: tier_name: {min: seconds, max: seconds, count: videos_per_keyword}
  duration_tiers:
    short:
      min: 20
      max: 120
      count: 8
    medium:
      min: 120
      max: 600
      count: 8
    long:
      min: 600
      max: 1500
      count: 5
    longer:
      min: 1500
      max: 3000
      count: 5
  
  # Quality settings
  preferred_quality: "1080"
  max_quality: "2160"
  prefer_h264: true  # Avoid VP9/AV1 that need transcoding
  
  # DaVinci Resolve compatible codecs (no transcode needed)
  davinci_compatible_codecs:
    - "h264"
    - "hevc"
    - "prores"
    - "dnxhd"
    - "dnxhr"
  
  # Codecs that require transcoding
  transcode_codecs:
    - "vp9"
    - "av1"
    - "vp8"
  
  # Transcoding settings
  transcode_codec: "h264"
  transcode_crf: 18
  use_hw_accel: true
  hw_accel_type: "auto"  # auto, cuda, amf, qsv, videotoolbox
  
  # Rate limiting
  max_downloads_per_keyword: 10
  download_delay: 1.0
  
  # Checkpointing for resume
  use_checkpoints: true
  checkpoint_file: "download_checkpoint.json"

# -----------------------------------------------------------------------------
# STOCK FOOTAGE (Pexels, Pixabay)
# -----------------------------------------------------------------------------
# Downloads royalty-free stock footage from APIs.

stock_footage:
  enabled: true
  
  # Per-source enable
  pexels_enabled: true
  pixabay_enabled: true
  
  # Download limits
  per_keyword: 3
  min_duration: 5
  max_duration: 60
  min_height: 720
  
  # Preferences
  prefer_landscape: true
  
  # Rate limiting
  request_interval: 0.5

# -----------------------------------------------------------------------------
# IMAGE DOWNLOAD
# -----------------------------------------------------------------------------
# Downloads high-resolution still images for B-roll.

image_download:
  enabled: false  # Enable if you need still images
  
  pexels_enabled: true
  pixabay_enabled: true
  unsplash_enabled: true
  
  # Quality filtering (reject small images)
  min_size_mb: 1.0
  min_width: 1920
  prefer_landscape: true
  
  per_keyword: 3

# -----------------------------------------------------------------------------
# DEDUPLICATION
# -----------------------------------------------------------------------------
# Removes duplicate videos using perceptual hashing.

deduplication:
  enabled: true
  
  # Hash distance threshold (0 = identical, lower = stricter)
  # Recommended: 10 for balanced, 5 for strict
  hash_threshold: 10
  
  use_first_frame: true  # Hash first frame only (fast)
  
  auto_delete: true
  generate_report: true

# -----------------------------------------------------------------------------
# OUTPUT GENERATION
# -----------------------------------------------------------------------------
# Timeline and report generation settings.

output:
  output_dir: "output"
  
  # File formats to generate
  generate_otio: true
  generate_edl: true
  generate_xml: true       # DaVinci Resolve XML
  generate_report: true    # Markdown match report
  
  # Alternative tracks (V2, V3)
  num_alternatives: 2
  
  # Strategy tracks (V4-V8)
  include_strategy_tracks: true
  strategy_tracks:
    - "visual_first"        # V4: Prioritize scene descriptions
    - "different_source"    # V5: Force different video file
    - "keyword_only"        # V6: Match on keywords only
    - "embedding_diversity" # V7: Maximally different from V1
    - "source_rotation"     # V8: Round-robin sources
  
  # Track naming (for OTIO/EDL)
  track_names:
    V1: "Primary"
    V2: "Alternative 1"
    V3: "Alternative 2"
    V4: "Visual-First"
    V5: "Different-Source"
    V6: "Keyword-Only"
    V7: "Embedding-Diversity"
    V8: "Source-Rotation"
    A8: "Voiceover"
  
  # Confidence color coding (for markers)
  confidence_colors:
    high: "GREEN"      # >= 0.80
    good: "CYAN"       # >= 0.60
    medium: "YELLOW"   # >= 0.40
    low: "ORANGE"      # >= 0.20
    gap: "RED"         # < 0.20
  
  # Speed markers
  include_speed_markers: true
  max_recommended_speed: 1.5

# -----------------------------------------------------------------------------
# MULTI-STYLE OUTPUT
# -----------------------------------------------------------------------------
# Generate multiple OTIO timelines with different styles.

multi_style:
  enabled: false
  styles:
    - "default"
    - "strict"
  
  # Style presets (can add custom styles here)
  presets:
    default:
      confidence_threshold: 0.5
      num_alternatives: 2
    strict:
      confidence_threshold: 0.7
      num_alternatives: 1
    stock_heavy:
      prefer_stock_footage: true
      confidence_threshold: 0.5
    fast_paced:
      prefer_shorter_clips: true
      ideal_speed_range: [0.7, 1.0]
    cinematic:
      prefer_longer_clips: true
      ideal_speed_range: [1.0, 1.5]

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Logging and monitoring settings.

logging:
  log_dir: "logs"
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  
  # Output targets
  log_to_file: true
  log_to_console: true
  generate_json_log: true  # Machine-parseable log
  
  # Log content
  log_api_calls: true
  log_match_decisions: true
  log_performance: true
  
  # Cost tracking
  track_api_costs: true
  
  # Config debugging
  log_config_access: false   # Enable to see which config values are accessed
  warn_on_hardcoded: true    # Warn when components use hardcoded values

# -----------------------------------------------------------------------------
# CACHE
# -----------------------------------------------------------------------------
# Caching settings for all components.

cache:
  cache_dir: ".cache"
  
  # Per-type caching
  cache_transcriptions: true
  cache_embeddings: true
  cache_scenes: true
  cache_llm_responses: true
  cache_vision: true
  
  # Cross-project cache (share between projects)
  cross_project_cache: false
  cross_project_cache_dir: ""
  
  # Validation
  validate_cache_on_load: true
  use_file_hash: true  # Fast hash using path+size+mtime

# -----------------------------------------------------------------------------
# FILE WATCHER
# -----------------------------------------------------------------------------
# Watch for new videos and auto-index.

watcher:
  enabled: false
  watch_interval: 30  # seconds
  incremental: true   # Only process new files

# -----------------------------------------------------------------------------
# PIPELINE AUTOMATION
# -----------------------------------------------------------------------------
# Control which pipeline stages run.

pipeline:
  # Skip stages (for debugging or partial runs)
  skip_download: false
  skip_transcription: false
  skip_scene_detection: false
  skip_matching: false
  
  # Resume/retry
  resume_enabled: true
  max_retries: 3
  
  # Parallel processing
  parallel_transcription: true
  parallel_embedding: true

# -----------------------------------------------------------------------------
# API KEYS (loaded from environment variables)
# -----------------------------------------------------------------------------
# API keys should be set as environment variables, not in this file.
# This section documents which keys are used.
#
# Required environment variables:
#   GEMINI_API_KEY      - Google Gemini (LLM, embeddings, vision)
#   ANTHROPIC_API_KEY   - Anthropic Claude (secondary LLM)
#   VOYAGE_API_KEY      - Voyage AI (alternative embeddings)
#   PEXELS_API_KEY      - Pexels stock footage
#   PIXABAY_API_KEY     - Pixabay stock footage
#   UNSPLASH_API_KEY    - Unsplash images
#
# api_keys section is auto-populated from environment variables.
# Do not commit API keys to version control.
