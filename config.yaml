# =============================================================================
# MATCHER-ALT CONFIGURATION v4.0
# =============================================================================
#
# Chain-of-thought: Centralized config for media matching pipeline
# Reasoning: Single source of truth reduces maintenance and improves consistency
# Decision: 2-space indentation with max 5-level nesting for LLM readability
#
# Pipeline: 7-stage caption-first flow
#   ANALYZE → VIDEO_SEARCH → CAPTION → MATCH → ITERATIVE_MATCH → DOWNLOAD_SEGMENTS → OUTPUT
#
# Usage:
#   from src.config import load_config, get_config
#   config = load_config("config.yaml")
#   threshold = config.matching.min_confidence
#
# Performance: CSafeLoader enables <100ms config loading
# =============================================================================

# -----------------------------------------------------------------------------
# PROJECT IDENTIFICATION
# -----------------------------------------------------------------------------
project:
  name: matcher-alt
  version: 4.0.0
  description: AI-powered voiceover-to-footage matching pipeline (caption-first)
  # max_name_display_length: 15  # Max chars for project name in short download paths (e.g., E:/v/<name>)

project_dir: "."

# -----------------------------------------------------------------------------
# SHARED DEFAULTS (YAML Anchors for DRY configuration)
# -----------------------------------------------------------------------------
# Chain-of-thought: Repeated values should use anchors to ensure consistency
# Reasoning: Single point of change, reduces errors
# Decision: Define common patterns here, reference with aliases below

defaults:
  # API retry settings
  api_retry: &api_retry
    max_retries: 3
    retry_delay: 2.0
  
  # Quality thresholds
  quality: &quality_defaults
    min_confidence: 0.6
    high_confidence: 0.85
    low_confidence: 0.5
  
  # Rate limiting
  rate_limit: &rate_limit
    request_interval: 0.5
    max_requests_per_minute: 60

# -----------------------------------------------------------------------------
# RATE LIMITING (global settings)
# -----------------------------------------------------------------------------
# Chain-of-thought: Centralized rate limit config prevents scattered values
# Reasoning: One place to tune all rate limit behavior across the pipeline
# Decision: Reasonable defaults that work for most download scenarios

rate_limit:
  # Slots per second: how many download/request slots available per second
  # Higher values = more aggressive downloading (0.5 = 1 request every 2 seconds)
  slots_per_second: 0.5

  # Burst size: how many requests can be made in a burst before rate limiting kicks in
  # Allows short bursts above the steady-state rate
  burst_size: 3

  # Jitter factor: randomization factor for request timing (0.0-1.0)
  # Adds randomness to avoid detection patterns: actual_delay = delay * (1 + random * jitter)
  jitter_factor: 0.2

  # Maximum backoff time in seconds when rate limited
  # After this limit, requests will proceed even if rate limited
  max_backoff_seconds: 60.0

# -----------------------------------------------------------------------------
# VIDEO SEARCH (YouTube Search without Download)
# -----------------------------------------------------------------------------
# Chain-of-thought: Caption-first flow searches YouTube for video IDs only
# Reasoning: No download needed until after matching - saves bandwidth
# Decision: Search more videos than needed, filter by duration/title
#
# Stage: VIDEO_SEARCH (stage 2 of 7-stage pipeline)
# Output: state.video_ids, state.video_search_results

video_search:
  results_per_keyword: 20         # YouTube results per keyword (search pool)
  max_total_results: 200          # Cap on total video IDs collected
  search_timeout: 30              # Seconds before keyword timeout
  apply_duration_filter: true     # Filter by duration_tiers config
  apply_title_blacklist: true     # Filter by download.title_blacklist
  apply_llm_title_filter: true    # Use LLM to filter irrelevant titles (see download.llm_title_filter)
  deduplicate_across_keywords: true  # Remove duplicate video IDs from different keywords

# -----------------------------------------------------------------------------
# TRANSCRIPTION (faster-whisper) - DEPRECATED in v4.0
# -----------------------------------------------------------------------------
# NOTE: Transcription is no longer used in the simplified 7-stage pipeline.
# Caption-first mode uses YouTube captions instead of Whisper transcription.
# This section is kept for backward compatibility with older projects.
#
# Chain-of-thought: GPU acceleration critical for performance
# Reasoning: Parallel audio extraction (CPU) + sequential GPU transcription
# Decision: max_workers=4 balances CPU parallelism with memory usage

transcription:
  provider: faster-whisper

  # Model selection - larger = more accurate but slower
  # Options: tiny, base, small, medium, large, large-v2, large-v3
  model: base
  language: en

  # GPU settings
  # Chain-of-thought: GPU much faster but requires CUDA
  # Reasoning: compute_type=auto lets faster-whisper choose optimal
  use_gpu: true
  compute_type: auto  # auto, float16, int8, float32

  # GPU memory pre-check (US-60-007)
  # Minimum free GPU memory required before loading model (MB)
  # Model sizes (approximate VRAM at float16):
  #   tiny: ~400MB, base: ~500MB, small: ~1GB, medium: ~2GB, large: ~3GB
  # If available memory is below this threshold, a warning is logged
  minimum_gpu_memory_mb: 2000
  # Automatically downgrade model if insufficient GPU memory
  # e.g., if 'large' requested but only 1GB available, use 'small' instead
  auto_downgrade_model: true

  # Parallel processing
  # Chain-of-thought: CPU can extract audio in parallel
  # Reasoning: GPU transcription must be sequential (shared model)
  max_workers: 4
  batch_size: 10

  # Audio extraction parallelism (US-60-010)
  # Number of parallel workers for FFmpeg audio extraction (Phase 1)
  # Default: min(4, cpu_count()) for sensible default on various machines
  # Set to 0 to use the default calculation
  # Validated to ensure <= cpu_count() (capped automatically if exceeded)
  audio_extraction_workers: 0

  # Automatic GPU cleanup after batch transcription (US-60-011)
  # When true, automatically unloads WhisperModel after transcribe_videos_parallel()
  # to free GPU memory for subsequent stages (embedding, matching)
  # The cleanup is called in a finally block, so it runs even if batch processing fails
  auto_cleanup_after_batch: true

  # Voice Activity Detection
  # Chain-of-thought: VAD skips silence, improves accuracy FOR VOICEOVER
  # WARNING: VAD can be too aggressive for YouTube videos with varying audio quality
  # Note: Videos have VAD hardcoded OFF in parallel_processor.py (not configurable)
  # This setting only affects voiceover transcription in AnalyzeStage
  vad_filter: true  # Enable for voiceover - helps gap detection
  min_silence_duration_ms: 200
  speech_pad_ms: 10
  
  # Segment splitting (for voiceover optimization)
  # Splits long segments at sentence boundaries for better matching
  split_threshold_multiplier: 1.5  # Split if > multiplier * median
  long_median_threshold: 8.0  # If median > this, use absolute threshold
  absolute_split_threshold: 12.0  # Absolute threshold for very long segments
  min_split_duration: 4.0  # Minimum duration to consider splitting
  
  # Pause-based splitting (more aggressive, for natural pauses)
  # Detects silences between SRT segments and splits at natural breaks
  pause_split:
    enabled: true  # Enable pause-based splitting
    min_gap_ms: 500  # Minimum gap between SRT segments to consider a pause (ms)
    split_at_sentences: true  # Split at sentence boundaries (. ! ?) - most aggressive
    split_at_list_markers: true  # Split before "1.", "2.", "8." etc. (countdown patterns)
    split_at_locations: true  # Split at "City, State" patterns
    min_phrase_words: 2  # Minimum words to keep in a segment
    min_segment_duration: 0.5  # Minimum duration for a split segment (seconds)
  
  # Caching
  cache_transcriptions: true
  cache_dir: transcriptions

  # Audio extraction timeout (seconds)
  # FFmpeg subprocess killed if extraction exceeds this limit
  # Increase for very long videos or slow storage
  audio_extraction_timeout: 60

# -----------------------------------------------------------------------------
# EMBEDDINGS
# -----------------------------------------------------------------------------
# Chain-of-thought: Vector embeddings enable semantic similarity search
# Reasoning: Gemini best quality, local for offline/free usage
# Decision: batch_size=100 optimal for Gemini API limits

embedding:
  # Options: gemini, openai, local, sentence_transformers, ollama
  provider: gemini

  # Model names per provider
  gemini_model: models/gemini-embedding-001
  voyage_model: voyage-2
  local_model: all-MiniLM-L6-v2
  ollama_model: nomic-embed-text
  ollama_base_url: http://localhost:11434

  # Batch processing
  # Chain-of-thought: Batching reduces API calls by 100x
  # Provider maximum batch sizes (hard API limits):
  #   - gemini: 100 (Gemini API hard limit)
  #   - voyage: 128 (Voyage AI hard limit)
  #   - openai: 2048 (OpenAI limit)
  #   - local: 256 (reasonable memory limit)
  # Note: validate_batch_size() warns if batch_size exceeds provider max
  batch_size: 100
  <<: *api_retry

  # Parallel processing (for large text sets)
  # ThreadPoolExecutor workers for parallel batch processing (1-8 recommended)
  # More workers = faster for large batches, but more API connections
  max_workers: 4

  # Caching
  cache_embeddings: true
  cache_batch_results: true

# -----------------------------------------------------------------------------
# INDEXING (FAISS)
# -----------------------------------------------------------------------------
# Chain-of-thought: Vector index for fast similarity search
# Reasoning: Flat index exact but O(n), IVF approximate but O(sqrt(n))
# Decision: Use flat for <10k vectors, IVF for larger datasets

indexing:
  index_type: flat  # flat, ivf
  use_faiss: true
  
  # IVF settings (only used if index_type is "ivf")
  ivf_nlist: 100   # Number of clusters
  ivf_nprobe: 10   # Clusters to search at query time
  
  # Similarity
  normalize_embeddings: true
  similarity_metric: cosine  # cosine, dot, euclidean

# -----------------------------------------------------------------------------
# VISION PROCESSING
# -----------------------------------------------------------------------------
# Chain-of-thought: Vision API expensive, use selectively
# Reasoning: Only process scenes where transcript is sparse
# Decision: coverage_threshold=0.3 means skip if >30% transcribed

vision:
  provider: gemini
  model: gemini-2.0-flash
  enabled: true
  
  # Selective processing
  # Chain-of-thought: Skip vision if transcript provides enough context
  min_words_per_scene: 5
  coverage_threshold: 0.3
  max_scenes_per_video: 50
  
  # Frame extraction
  frame_format: jpg
  frame_quality: 85
  
  # Cost management
  max_api_calls_per_run: 100
  estimated_cost_per_call: 0.001

# -----------------------------------------------------------------------------
# SCENE DETECTION (PySceneDetect) - DEPRECATED in v4.0
# -----------------------------------------------------------------------------
# NOTE: Scene detection is no longer used in the simplified 7-stage pipeline.
# Matching now uses captions directly without scene-level granularity.
# This section is kept for backward compatibility with older projects.
#
# Chain-of-thought: Scene boundaries enable granular clip selection
# Reasoning: Presets balance speed vs accuracy for different use cases
# Decision: "balanced" default, "fast" for preview, "accurate" for final

scene_detection:
  enabled: true
  preset: balanced  # fast, balanced, accurate
  
  # Individual settings (can override preset)
  threshold: 27.0
  min_scene_len: 15  # frames
  downscale_factor: 4
  frame_skip: 2
  
  # Minimum video duration to process (seconds, 0 = no minimum)
  min_video_duration: 0
  
  # Audio analysis integration
  audio_analysis: true
  silence_threshold_db: -40.0
  min_silence_duration: 0.3
  
  # Hardware acceleration
  use_gpu: true
  force_gpu: false

  # Face detection per scene (B-roll identification)
  # Analyzes each scene for faces to identify B-roll footage
  detect_faces_per_scene: true  # Enable scene-level face detection
  face_sample_frames: 3  # Frames to sample per scene

# -----------------------------------------------------------------------------
# AUDIO ANALYSIS (librosa)
# -----------------------------------------------------------------------------
audio_analysis:
  enabled: true
  sample_rate: 22050
  
  # Silence detection
  silence_threshold_db: -40.0
  min_silence_duration: 0.3
  
  # Speech detection
  speech_threshold: 0.5
  min_speech_duration: 0.2

# -----------------------------------------------------------------------------
# MATCHING ENGINE
# -----------------------------------------------------------------------------
# Chain-of-thought: Two-stage matching optimizes cost vs quality
# Reasoning: Embedding search cheap (FAISS), LLM expensive
# Decision: Retrieve 20 candidates → rerank top 5 with LLM

matching:
  # Confidence thresholds (using shared defaults)
  <<: *quality_defaults

  # Negative sampling for LLM reranking
  # Chain-of-thought: LLMs need calibration to set accurate confidence scores
  # Reasoning: Showing a poor match helps LLM understand what "unlikely" looks like
  # Decision: Select from bottom 25% of candidates as negative sample
  negative_sampling_enabled: true  # Include negative sample in LLM prompts

  # Clip reuse prevention
  # Chain-of-thought: Prevent same clip appearing multiple times
  # Reasoning: Variety improves viewer experience
  max_clip_reuse: 1
  reuse_penalty: 0.5

  # Global clip deduplication (hard block mode)
  # Chain-of-thought: Same clip should NEVER appear twice anywhere in timeline
  # Reasoning: Prevents exact duplicate footage across segments and tracks
  clip_hard_block: true  # Each clip can only appear once in entire timeline

  # Source file reuse prevention
  # Chain-of-thought: Prevent over-reliance on single video file
  # Reasoning: One video shouldn't dominate the timeline
  max_source_file_reuse: 3  # 0 = unlimited, 3 = max 3 clips from same video
  source_file_penalty: 0.05  # Penalty per use after reaching half the max

  # Two-stage matching optimization
  # Chain-of-thought: FAISS retrieval is O(1), LLM reranking is expensive
  # Reasoning: Cast wide net with embeddings, refine with LLM
  # Note: Need 75+ candidates for V1-V6 (6 unique video files)
  embedding_candidates: 75  # Retrieve from FAISS
  llm_rerank_candidates: 8  # Send to LLM
  
  # Duration scoring
  # Chain-of-thought: Extreme speed changes look unnatural
  # Reasoning: Penalize clips requiring >1.5x or <0.7x speed
  ideal_speed_min: 0.85
  ideal_speed_max: 1.15
  soft_speed_min: 0.70
  soft_speed_max: 1.50
  duration_penalty_factor: 0.1
  
  # Keyword/entity boosting
  keyword_boost: 0.05
  entity_boost: 0.08

  # US-63-011: Named entity match boost
  # When voiceover text contains named entities (people, places, organizations)
  # and video caption contains matching entity, apply this confidence boost
  entity_match_boost: 0.1  # Default boost for entity matches

  # LLM providers (tiered: primary → secondary → local)
  # Chain-of-thought: Fallback chain ensures reliability
  # Reasoning: Gemini fast/cheap, Claude for ambiguous, Ollama offline
  # Options: gemini, anthropic, local, embedding_only
  primary_provider: gemini
  secondary_provider: anthropic
  local_provider: ollama
  
  # Model names
  gemini_model: gemini-2.0-flash
  anthropic_model: claude-3-haiku-20240307
  ollama_model: llama3.2
  ollama_host: http://localhost:11434
  
  # Caching
  cache_llm_responses: true
  cache_ttl_hours: 24

  # Delta matching (only match new videos)
  # Chain-of-thought: Avoid re-matching unchanged videos
  # Reasoning: Saves time when adding new videos to existing project
  delta_matching_enabled: true  # Enable delta-aware matching
  force_rematch: false  # Force rematch all videos (set via CLI --force-rematch)
  rematch_improvement_threshold: 0.05  # Re-evaluate if new video potentially 5% better

  # Chapter/topic matching
  # Chain-of-thought: Match videos based on topic relevance to voiceover chapters
  # Reasoning: Prevents matching Dallas videos to Boise narration
  chapter_matching_enabled: true  # Enable chapter-based topic filtering
  topic_mismatch_penalty: 0.15  # Confidence reduction for topic mismatch (0.0-0.5)
  extract_video_topics: true  # Extract topics from video transcripts using LLM
  min_topic_overlap: 1  # Minimum matching topic keywords required

  # B-roll preference (scene-level face detection)
  # Chain-of-thought: B-roll (no faces) is more useful for matching to narration
  # Reasoning: Talking heads from news/interviews don't fit narration well
  # Decision: When topic matches, boost scenes without faces
  prefer_broll_when_topic_matches: true  # Enable B-roll preference when topic matches
  broll_face_threshold: 0.3  # face_score < this = B-roll (0.0=no faces, 1.0=all faces)
  broll_boost: 0.2  # Confidence boost for matching B-roll (+20%)

  # Caption quality adjustment (US-007, US-006)
  # Chain-of-thought: Caption quality varies significantly between human-uploaded and auto-generated
  # Reasoning: Human captions more reliable for matching, auto-generated may have errors
  # Decision: Boost confidence for high quality, penalize low quality/fallback
  caption_quality_adjustment_enabled: true  # Enable caption quality confidence adjustment

  # Additive mode (US-007) - used when caption_quality_weights is not set
  caption_quality_high_boost: 0.05  # Boost for high-quality human captions (+5%)
  caption_quality_low_penalty: 0.1  # Penalty for low-quality/fallback captions (-10%)

  # Multiplicative weights mode (US-006) - when set, overrides additive mode
  # Keys: high, medium, low; Values: multiplier (0.0-1.0)
  # Example: adjusted = raw_confidence * weight (e.g., 0.85 * 0.75 = 0.64 for low quality)
  # caption_quality_weights:
  #   high: 1.0    # Human captions - no change
  #   medium: 0.9  # Auto captions - reduce by 10%
  #   low: 0.75    # Fallback/poor - reduce by 25%

  # Caption timing penalty (US-008 Sprint 7)
  # Penalizes matches when caption timing is poor (low coverage, exceeds video duration)
  # Formula: adjusted = raw * quality_weight * timing_penalty
  # timing_penalty = 1.0 - (exceeds_ratio * 0.3) - ((1 - coverage_ratio) * 0.2)
  # Example: 50% coverage, 20% exceeds -> timing_penalty = 0.84 (~16% penalty)
  apply_timing_penalty: true  # Enable timing-based confidence penalty

  # Temporal coherence (adjacent segment scoring)
  # Chain-of-thought: Adjacent segments should have visual continuity
  # Reasoning: Clips from same source video as previous/next segment feel more cohesive
  # Decision: Apply small boost for same-source, small penalty for jarring switches
  temporal_coherence_enabled: true  # Enable temporal coherence scoring
  temporal_coherence_same_source_boost: 0.05  # Boost for clips from same source as adjacent (+5%)
  temporal_coherence_context_switch_penalty: 0.05  # Penalty for jarring context switches (-5%)

  # Fallback matching (for edge cases when primary matching fails)
  # Chain-of-thought: Some segments may not match well with embedding/LLM approach
  # Reasoning: Use fallback strategies with confidence ceilings for difficult cases
  # Decision: 3 levels - keyword-only (0.7), visual-description (0.5), generic-broll (0.3)
  fallback_matching_enabled: true  # Enable fallback matching for edge cases
  fallback_trigger_threshold: 0.4  # Trigger fallback when primary confidence below this

  # Transcript quality scoring
  # Chain-of-thought: Low-quality transcripts make embedding matching unreliable
  # Reasoning: Short, incoherent, or repetitive transcripts don't represent video content well
  # Decision: Reduce embedding weight by 20% for low-quality transcripts
  transcript_quality_weight: true  # Enable transcript quality-based weight adjustment

  # Pool size normalization
  # Chain-of-thought: Confidence is relative to pool size - small pools have different dynamics
  # Reasoning: Top match in 5-video pool is more meaningful than top in 500-video pool
  # Decision: Normalize using sqrt(pool_size/50), capped at [0.8, 1.2]
  # - Small pools (<10) + clear winner: Boost confidence
  # - Large pools (>100) + tight margins: Reduce confidence
  pool_normalization_enabled: true  # Enable confidence normalization by pool size

  # Chain-of-thought prompting for LLM matching
  # Chain-of-thought: Structured reasoning produces more reliable match decisions
  # Reasoning: Explicit 4-step process: themes → elements → rubric → score
  # Decision: Use rubric weights - visual (30%), topic (40%), keyword (20%), flow (10%)
  chain_of_thought_enabled: true  # Enable structured reasoning prompts

  # Early termination for obvious high-confidence matches
  # Chain-of-thought: Skip expensive LLM call when match is obviously good
  # Reasoning: Embedding sim >0.9 + 3+ keywords + same entity = very high confidence
  # Decision: Return min 0.92 confidence to ensure consistent high-quality matches
  obvious_match_enabled: true  # Enable early termination for obvious matches
  obvious_match_min_similarity: 0.9  # Minimum embedding similarity for obvious match
  obvious_match_min_keywords: 3  # Minimum matched keywords for obvious match
  obvious_match_min_confidence: 0.92  # Minimum confidence for obvious matches

  # Multi-modal similarity weighting
  # Chain-of-thought: Multiple signals (embedding, keywords, entities, visual) should contribute to match
  # Reasoning: Simple additive boosting doesn't properly weight different signal strengths
  # Decision: Weighted fusion with configurable weights that sum to 1.0
  multimodal_enabled: true  # Enable multi-modal similarity weighting
  multimodal_weights:  # Weights for each similarity component (must sum to 1.0)
    text_embedding: 0.40     # Semantic similarity from text embeddings (40%)
    keyword_overlap: 0.25    # Matched keywords between voiceover and video (25%)
    entity_match: 0.20       # Named entity overlap - people, places, organizations (20%)
    visual_description: 0.15 # Visual scene description similarity (15%)

  # Semantic coherence (topic flow between adjacent segments)
  # Chain-of-thought: Adjacent segments should have related content for smooth timeline
  # Reasoning: Embedding similarity between current and previous match indicates topic flow
  # Decision: Boost smooth flow (+0.03 when sim>0.6), penalize abrupt (-0.05 when sim<0.3)
  semantic_coherence_enabled: true  # Enable semantic coherence scoring for topic flow

  # Explanation confidence validation
  # Chain-of-thought: LLM explanations should reference actual content
  # Reasoning: Detects "hallucinated" explanations that mention non-existent keywords
  # Decision: Downgrade confidence by 0.1 when <50% of explanation keywords are verifiable
  explanation_validation_enabled: true  # Enable LLM explanation keyword verification

  # Scoring thresholds (US-53-002)
  # Chain-of-thought: Hardcoded thresholds prevent tuning without code edits
  # Reasoning: Extract all scoring constants into config for easy experimentation
  # Decision: Nested dataclass with sensible defaults matching original hardcoded values
  scoring:
    confidence_floor: 0.05             # Minimum confidence after all penalties
    low_confidence_warning_threshold: 0.15  # Warn when penalized below this
    entity_match_boosts:               # Graduated boost by entity match count
      '1': 0.05                        # 1 entity match
      '2': 0.08                        # 2 entity matches
      '3+': 0.12                       # 3+ entity matches
    keyword_overlap_thresholds:        # Score by keyword match count
      '1': 0.35
      '2': 0.55
      '3': 0.75
      '4': 0.90
      '5+': 1.0
    transcript_quality_high: 0.8       # Score above this = high quality
    transcript_quality_medium: 0.5     # Score above this = medium quality
    transcript_min_words_good: 50      # Word count for "good" quality
    transcript_min_words_medium: 20    # Word count for "medium" quality
    multimodal_default_weights:        # Default weights when multimodal_weights not set (sum to 1.0)
      text_embedding: 0.40
      keyword_overlap: 0.25
      entity_match: 0.20
      visual_description: 0.15
    semantic_coherence_smooth_threshold: 0.6   # Above = smooth topic flow
    semantic_coherence_abrupt_threshold: 0.3   # Below = abrupt transition
    semantic_coherence_smooth_boost: 0.03      # Boost for smooth flow
    semantic_coherence_abrupt_penalty: 0.05    # Penalty for abrupt transition
    pool_normalization_reference_size: 50      # Reference pool size for normalization
    pool_normalization_min_factor: 0.8         # Min normalization factor
    pool_normalization_max_factor: 1.2         # Max normalization factor
    pool_small_threshold: 10                   # Pool "small" below this
    pool_large_threshold: 100                  # Pool "large" above this
    pool_tight_margin_threshold: 0.05          # Top-2 score diff for "tight margin"

  # Location-aware matching (for travel/location content)
  # Chain-of-thought: Travel/location videos need geographic context matching
  # Reasoning: "Paris" in script should match Paris, France footage, not Paris, Texas
  # Decision: Hard filter by country, soft fallback when too strict
  location_matching:
    enabled: true  # Enable location-aware matching for geographic content
    geonames_username: ""  # Or set GEONAMES_USERNAME in .env (free account at geonames.org)
    hard_filter_level: "city"  # "city", "state", "country", or "continent" - filter strictness
    geographic_penalty: 0.4  # Penalty for wrong location in soft fallback mode (0.0-1.0)
    hierarchy_bonus: 0.15  # Bonus for parent/child match (France video for Paris chapter)
    landmark_bonus: 0.2  # Bonus when landmark detected in video
    use_llm_disambiguation: true  # Use LLM to resolve ambiguous locations (Paris FR vs TX)
    cache_dir: ".cache/locations"  # Cache geocoding results

  # Negative matching rules are defined in the top-level 'negative_matching:' section below.
  # See NegativeMatchingConfig in src/config/sections/matching.py for the dataclass definition.

# -----------------------------------------------------------------------------
# KEYWORD EXTRACTION
# -----------------------------------------------------------------------------
keyword:
  provider: gemini  # gemini, anthropic, tfidf
  
  # Extraction settings
  max_keywords: 30
  min_keyword_length: 3
  max_keyword_words: 8  # Max words per keyword (rejects "too long" phrases)
  segments_per_query: 3  # Number of voiceover segments grouped per search query

  # List-based keyword detection
  # Detects numbered lists (e.g., "Number 10 Austin, Texas") and ensures
  # each list item gets a guaranteed download keyword
  list_detection:
    enabled: true  # Enable list item detection
    download_first: true  # Download list item keywords before general keywords
    skip_if_entity_covered: true  # Skip if already in entity extraction
    keyword_suffix: "footage"  # Suffix for generated keywords (e.g., "Austin Texas footage")

# -----------------------------------------------------------------------------
# NEGATIVE MATCHING (What NOT to match)
# -----------------------------------------------------------------------------
negative_matching:
  enabled: true
  rules:
    - "Don't match talking head shots to action narration"
    - "Don't match static images to dynamic narration"
    - "Avoid matching unrelated b-roll to specific statements"

# -----------------------------------------------------------------------------
# ZERO-DOWNLOAD KEYWORD REMIX - DEPRECATED in v4.0
# -----------------------------------------------------------------------------
# NOTE: The REMIX stage is no longer used in the simplified 7-stage pipeline.
# Video filtering now happens during VIDEO_SEARCH stage using title blacklist
# and LLM title filter. This section is kept for backward compatibility.
#
# Enables filtering/remixing of downloaded videos based on keyword relevance
# before transcription, without additional downloads.
# Triggered after initial batch downloads complete.
# Controls REMIX pipeline stage (keyword-based video filtering).

remix:
  enabled: true  # Controls REMIX stage (filters videos before transcription)
  trigger_after_download: true
  
  # Scoring thresholds
  min_relevance_score: 0.1     # Minimum score to include (0.0-1.0)
  high_relevance_threshold: 0.5  # Score for "high relevance" label
  
  # Processing limits
  max_files_to_process: 500    # Maximum videos to scan
  max_files_to_include: 100    # Maximum videos to pass to transcription
  
  # Matching settings
  fuzzy_match: true            # Allow partial keyword matches
  case_sensitive: false
  
  # Interactive mode
  interactive_curation: true   # Ask user to confirm remix
  show_excluded: true          # Show which files were excluded
  
  # Auto-accept filter (set upfront, skip mid-pipeline prompt)
  # Options: "filtered" (use filtered), "all" (use all videos), "prompt" (ask during pipeline)
  auto_accept_filter: all
  
  # Logging
  log_level: INFO
  log_file_processing: false   # Log each file (verbose)
  
  # Performance
  parallel_scoring: true
  max_workers: 4
  
  # Entity extraction
  # Chain-of-thought: Named entities get priority in searches
  # Reasoning: "Tokyo" more specific than "city"
  extract_entities: true
  entity_types:
    - PERSON
    - GPE      # Geo-political entity (city, country)
    - ORG
    - DATE
    - EVENT
  
  # TF-IDF fallback
  use_tfidf_weights: true
  tfidf_max_features: 100
  
  # Footage suffixes
  # Chain-of-thought: Adding "footage" improves YouTube search relevance
  add_footage_suffixes: true
  footage_suffixes:
    - 4K footage
    - news footage
    - drone footage
    - aerial footage
    - stock footage
    - documentary footage
  
  batch_size: 50

# -----------------------------------------------------------------------------
# ZERO-DOWNLOAD KEYWORD REMIX
# -----------------------------------------------------------------------------
# Chain-of-thought: When a keyword returns 0 downloads, use LLM to generate alternatives
# Reasoning: Specific keywords like "Wichita Kansas fentanyl 2024" may not exist on YouTube
# Decision: Automatically broaden/rephrase failed keywords and retry

zero_download_remix:
  enabled: true
  max_retries: 2           # Maximum remix attempts per batch
  use_llm: true            # Use LLM for smart remixing (Gemini/Claude)
  use_fallback: true       # Use rule-based fallback if LLM fails
  cache_results: true      # Cache remix results to avoid repeated API calls
  min_keywords_to_trigger: 1  # Minimum failed keywords to trigger remix
  max_keywords_per_batch: 20  # Maximum keywords to remix at once

# -----------------------------------------------------------------------------
# IMAGE SEARCH (Entity Stills)
# -----------------------------------------------------------------------------
# Downloads images for entities (people, places, organizations) mentioned
# in the voiceover. Images are placed on V9 track as stills/overlays.
# Controls ENTITY_IMAGES and ENTITY_VIDEOS pipeline stages.

image_search:
  enabled: true  # Controls ENTITY_IMAGES and ENTITY_VIDEOS stages
  
  # Short path settings (like download config)
  # Set root_dir to a short path near drive root for best results
  root_dir: "E:/i"      # Short path for images. Empty = use project_dir/images
  folder_name: "images" # Subfolder name when root_dir is empty
  
  # Images per entity (5 recommended for variety and backup options)
  images_per_entity: 1
  
  # Videos per entity for stock footage (3 recommended)
  videos_per_entity: 1
  
  # Minimum file size in MB (1MB ensures quality)
  min_size_mb: 1.0
  
  # Output directory (DEPRECATED - use root_dir instead)
  output_dir: images
  
  # Search sources (prioritized in order)
  use_google: true       # Google Images (requires: pip install pyimagedl)
  use_bing: false        # Bing Images (disabled - alive_progress conflicts with Google)
  use_stock_apis: true   # Pexels/Pixabay APIs for images AND videos (recommended fallback)
  
  # Entity types to search for
  entity_types:
    - PERSON
    - GPE        # Locations (cities, countries)
    - ORG        # Organizations
    - DATE       # Time periods
    - EVENT      # Named events
  
  # OTIO output settings
  image_track: V9           # Track for image stills (Google Images)
  stock_video_track: V10    # Track for stock videos (Pexels/Pixabay)
  default_duration: 0.0     # 0 = match segment duration
  
  # Download timeouts and limits
  download_timeout: 10       # Seconds per image download
  max_search_time: 300       # Max seconds for entire search per entity (5 minutes)
  max_results_to_check: 500  # Max search results to check per entity
  search_until_found: true   # If true, keeps searching until images_per_entity found (ignores max_results_to_check)
  
  # Stock video settings
  stock_video:
    min_duration: 3.0        # Minimum video duration in seconds
    max_duration: 30.0       # Maximum video duration in seconds
    prefer_hd: true          # Prefer HD quality videos

  # Cross-project entity image caching
  # When enabled, shares downloaded entity images across projects
  entity_cache:
    enabled: true                           # Enable global entity cache
    cache_dir: "~/.matcher_entity_cache"    # Shared cache location (~ = home dir)
    fuzzy_threshold: 0.85                   # Entity name matching threshold (0.0-1.0)
    max_age_days: 0                         # Cache expiration in days (0 = never expire)
    cache_strategy: "copy"                  # copy, symlink, or reference

  # Entity matching settings (V9/V10 track gap control)
  # Controls how entities match to voiceover segments in timeline
  enable_sticky_matching: false        # Reuse last entity when no match (creates continuous blocks)
  semantic_match_threshold: 0.15       # Minimum word overlap for match (0.0-1.0, default 0.15)

# -----------------------------------------------------------------------------
# LLM SETTINGS
# -----------------------------------------------------------------------------
# Chain-of-thought: Centralized LLM settings for keyword extraction and other tasks
# Reasoning: Multiple components need LLM access with consistent settings
# Decision: "google" provider uses Gemini, "anthropic" uses Claude

llm:
  provider: google  # google, anthropic, ollama
  model: gemini-2.0-flash

  # Anthropic specific (used when provider is "anthropic")
  anthropic_model: claude-3-haiku-20240307

  # Ollama specific (used when provider is "ollama")
  ollama_model: llama3.2
  ollama_host: http://localhost:11434

  # Generation settings (legacy compatibility)
  temperature: 0.7
  max_tokens: 2000

  # Retry configuration - unified for all LLM operations
  retry:
    max_retries: 3
    retry_delay_seconds: 2.0
    timeout_seconds: 120
    exponential_backoff: true

  # Cache configuration - unified LLM response caching with TTL
  # Quality tier tracking: cache entries are tagged high/medium/low based on confidence
  cache:
    enabled: true
    ttl_hours: 24  # 0 = never expire
    cache_dir: .cache/llm_responses
    expire_low_quality: false  # Skip low-quality cache entries (confidence < 0.5), forcing re-evaluation

  # Provider-specific configurations
  gemini:
    model: gemini-2.0-flash
    max_tokens: 2000
    temperature: 0.7

  anthropic:
    model: claude-3-haiku-20240307
    max_tokens: 2000
    temperature: 0.7

  ollama:
    model: llama3.2
    max_tokens: 2000
    temperature: 0.7

  # API keys loaded from environment:
  #   - google/gemini: GEMINI_API_KEY or GOOGLE_API_KEY
  #   - anthropic: ANTHROPIC_API_KEY
  #   - ollama: (no API key required for local models)
  #
  # New in v3.1: Unified LLM client with automatic retry, caching, and JSON parsing
  # See CLAUDE.md Rule 9 for usage examples

# -----------------------------------------------------------------------------
# ENHANCED FEATURES - DEPRECATED in v4.0
# -----------------------------------------------------------------------------
# NOTE: The STOCK stage is no longer used in the simplified 7-stage pipeline.
# Stock footage is now handled through iterative matching if needed.
# This section is kept for backward compatibility with older projects.
#
# Chain-of-thought: 90% confidence ensures quality output
# Reasoning: Better to flag gaps than use poor matches
# Decision: Enable keyword remix for automatic improvement

enhanced:
  enabled: true  # Controls STOCK stage (generic stock footage)
  min_confidence: 0.90  # 90% minimum target
  max_retries: 3

  # Keyword remix
  remix_enabled: true
  remix_keyword_count: 10

  # Stock footage integration (STOCK stage)
  enable_pexels: true
  enable_pixabay: true
  stock_per_keyword: 2
  
  # User prompts
  confirm_before_download: true
  prompt_enhanced_features: true
  non_interactive: false  # Set to true for fully automated runs (no prompts)
  
  # Face preference for matching
  # Options: neutral (no preference), prefer_faces (boost clips with faces), avoid_faces (penalize faces)
  face_preference: "neutral"

# -----------------------------------------------------------------------------
# DOWNLOADING (yt-dlp)
# -----------------------------------------------------------------------------
# Chain-of-thought: Duration tiers optimize for different content types
# Reasoning: Short clips for B-roll, long for documentary segments
# Decision: Prefer H.264 to avoid VP9/AV1 transcoding overhead

downloading:
  output_dir: downloaded_videos
  organize_by_keyword: true
  
  # Quality settings
  preferred_quality: "1080"
  max_quality: "2160"
  prefer_h264: true
  
  # DaVinci Resolve compatible codecs (no transcode needed)
  davinci_compatible_codecs:
    - h264
    - hevc
    - prores
    - dnxhd
    - dnxhr
  
  # Codecs requiring transcoding
  transcode_codecs:
    - vp9
    - av1
    - vp8
  
  # Transcoding settings
  transcode_codec: h264
  transcode_crf: 18
  use_hw_accel: true
  hw_accel_type: auto  # auto, cuda, amf, qsv, videotoolbox
  
  # Rate limiting
  max_downloads_per_keyword: 10
  download_delay: 1.0
  
  # Checkpointing
  use_checkpoints: true
  checkpoint_file: download_checkpoint.json

# -----------------------------------------------------------------------------
# DOWNLOAD (VideoDownloader settings)
# -----------------------------------------------------------------------------
# Chain-of-thought: VideoDownloader expects config.download with specific attrs
# Reasoning: Matches downloader.py VideoDownloader class expectations
# Decision: Provide all attributes that VideoDownloader uses

download:
  # ==========================================================================
  # SHORT PATH SETTINGS - Critical for NLE compatibility
  # ==========================================================================
  # Windows has 260 char path limit. Long paths cause DaVinci Resolve import issues.
  # These settings keep total path under 80 chars:
  #   E:/v/proj_name/keyword_s/title______xYz12345678.mp4
  #   ^--80 chars max------------------------------------------^
  #
  # Set root_dir to a short path near drive root for best results
  # Example paths with these settings:
  #   root_dir: "E:/v"  →  E:/v/myproject/winter_s/Snow_driv_abc123.mp4 (52 chars)
  #   root_dir: ""      →  D:/Projects/myproject/videos/winter_s/Snow_driv_abc123.mp4 (65 chars)
  
  root_dir: "E:/v"  # Short root path. Examples: "E:/v", "D:/vid", "C:/v"
  folder_name: "videos"  # Subfolder name when root_dir is empty
  max_keyword_len: 6     # Keyword folder: "winter" not "winter_road_conditions"
  max_filename_len: 8    # Filename: "Snow_dri_abc123.mp4" (8 + 11 + 4 = 23 chars)
  
  quality: "1080p"
  format: mp4
  
  # DaVinci Resolve compatibility
  davinci_mode: true
  davinci_codec: h264
  davinci_prores_profile: proxy
  
  # Hardware acceleration
  hw_accel: auto  # auto, cuda, amf, qsv, videotoolbox, none
  hw_quality: high
  
  # Download behavior
  min_views: 0
  delete_original: true
  delay_between_keywords: 1.0
  
  # Title blacklist - skip videos containing these terms (case-insensitive)
  # Useful for filtering out sports highlights, music videos, live streams, etc.
  title_blacklist:
    - "highlights"
    - "basketball"
    - "football"
    - "soccer"
    - "nba"
    - "nfl"
    - "mlb"
    - "nhl"
    - "ufc"
    - "boxing"
    - "wrestling"
    - "vs."
    - "vs "
    - "match"
    - "game recap"
    - "full game"
    - "full match"
    - "sports"
    - "espn"
    - "goals"
    - "touchdowns"
    - "live stream"
    - "livestream"
    - "webcam"
    - "live cam"
    - "24/7"
    - "24 7"
    - "lofi"
    - "lo-fi"
  
  # LLM Title Filter - use AI to check if video titles are relevant
  # This runs BEFORE downloading, saving bandwidth and time
  llm_title_filter:
    enabled: true
    provider: gemini  # gemini (fast) or anthropic (Claude Haiku)
    model: gemini-2.0-flash  # or claude-3-haiku-20240307
    batch_size: 20  # Check 20 titles at once
    min_relevance: 0.5  # 0-1, reject if below this (lower = more permissive)
  
  # YouTube authentication - REQUIRED!
  # YouTube blocks yt-dlp without authentication.
  #
  # Option 1 (RECOMMENDED): Extract cookies directly from browser
  # Set to: chrome, firefox, edge, brave, opera, vivaldi, safari
  # Note: Browser must be closed for Chrome/Edge. Firefox works while open.
  # Used by both CLI subprocess calls (--cookies-from-browser) and
  # Python API calls (cookiesfrombrowser key in ydl_opts).
  # The Python API does NOT read ~/.config/yt-dlp/config, so this setting
  # is critical for download_segments stage which uses the Python API.
  cookies_from_browser: firefox

  # Option 2: Use exported cookies.txt file
  # Export using browser extension: "Get cookies.txt LOCALLY" (Chrome) or "cookies.txt" (Firefox)
  # Leave empty to auto-detect cookies.txt in install/project directory
  # Fallback: if cookies_from_browser is empty, this path (or first cookie_rotation file)
  # is passed as 'cookiefile' to the yt-dlp Python API.
  cookies_path: ""
  
  # Search pool settings - IMPORTANT for finding matching videos!
  # YouTube search returns limited results, so we search more than we download
  # to find videos that match our duration filters
  search_pool_multiplier: 5  # Search 5x what we want to download
  min_search_pool: 40        # Minimum search pool size
  max_search_pool: 100       # Maximum search pool (for adaptive sizing)
  # Adaptive pool: automatically expands pool for low-pass-rate keywords

  # Timeout settings (seconds)
  # Search timeout: If YouTube search takes longer than this, try keyword remix
  # (max 2 remix attempts before giving up). Keep low to avoid blocking pipeline.
  search_timeout: 30         # Timeout for search metadata subprocess (triggers remix on timeout)
  download_timeout: 120      # Default timeout per video download (used for 'short' tier)

  # Stall timeout: seconds of no download progress (no yt-dlp output) before killing.
  # Unlike download_timeout which is a hard total, this allows slow downloads to
  # continue as long as they're making progress. 0 = use tier timeout as stall timeout
  # (NOT recommended — a medium tier video would wait 480s with zero output).
  stall_timeout: 60

  # Socket timeout: seconds before yt-dlp gives up on a stalled TCP connection.
  # Used by both subprocess calls (--socket-timeout) and Python API calls.
  # Without this, ydl.download() blocks indefinitely on stalled connections.
  socket_timeout: 30

  # Tier-specific download timeouts (longer videos need more time)
  download_timeouts:
    short: 180     # 3 min timeout for videos <2 min
    medium: 480    # 8 min timeout for videos 2-10 min
    long: 900      # 15 min timeout for videos 10-25 min
    longer: 1200   # 20 min timeout for videos 25-50 min

  # Audio-First Mode - Dramatically reduces download time
  # How it works:
  #   1. Downloads audio only (MP3) first - ~5% of video size
  #   2. Transcribes and matches against voiceover
  #   3. Downloads ONLY the matched video segments with buffer
  # Typical savings: 80-90% less download time/bandwidth
  audio_first:
    enabled: true           # Audio-first mode enabled by default
    buffer_seconds: 30.0    # Extra footage before/after each match
    merge_gap_seconds: 15.0 # Merge segments closer than this (reduces requests)
    audio_quality: 5        # 0 (best) to 9 (worst), 5 = ~128kbps
    fallback_full_video: true      # If segment download fails, download full video
    delete_audio_after_video: false # Keep audio files after video download
    checkpoint_phases: true  # Save checkpoint after each phase

  # Caption-First Mode - Faster matching with YouTube captions
  # How it works:
  #   1. Fetches YouTube captions (auto-generated or human) BEFORE video download
  #   2. Matches against voiceover using caption text
  #   3. Downloads ONLY the matched video segments
  # Benefits:
  #   - No audio download/transcription needed when captions available
  #   - Quality indicators: human vs auto-generated captions
  #   - Falls back to TRANSCRIBE stage (Whisper) when captions unavailable
  caption_first:
    # NOTE: Caption fetching is ALWAYS enabled (v4.0+). The 'enabled' field is deprecated.
    enabled: true                     # DEPRECATED: caption-first is now always on
    fallback_to_transcription: true   # Fall back to Whisper when captions unavailable
    preferred_language: "en"          # Preferred caption language (ISO 639-1 code)
    # Configurable language fallback chain (US-003)
    # List of ISO 639-1 codes to try after preferred_language fails
    # Example for multilingual projects: ["es", "pt", "fr"]
    # Empty list = default behavior (preferred_language -> en -> any)
    fallback_languages: []            # Language fallback chain (empty = default)
    timeout: 30                       # Timeout for caption fetch requests (seconds)
    prefer_human_captions: true       # Prefer human-uploaded over auto-generated
    allow_auto_generated: true        # Allow auto-generated caption fallback (US-59-007)
    cache_captions: true              # Cache captions for cross-project reuse
    cache_dir: "~/.matcher_caption_cache"  # Global cache directory (supports ~)
    max_cache_age_days: 30            # Cache TTL in days (0 = no expiration)
    # Retry settings (US-008): exponential backoff on network errors
    # CaptionUnavailableError (no captions exist) is NOT retried
    # CaptionFetchError (temporary failure) IS retried with backoff
    max_retries: 3                    # Max retry attempts on network/temporary errors
    retry_delay: 2.0                  # Base delay between retries in seconds
                                      # Actual delays: 2s, 4s, 8s (exponential backoff)
    # Parallel fetching (US-001): speed up projects with 50+ videos
    max_parallel_fetches: 4           # Number of concurrent caption fetches (1 = sequential)
    # Live stream detection (US-002): skip caption fetch for live streams
    # Live streams can hang indefinitely during caption fetch
    skip_live_streams: true           # Skip caption fetch for live/was_live videos
    # Upcoming stream handling (US-007 Sprint 8): how to handle scheduled streams/premieres
    # Options: 'skip' (treat like live), 'queue' (add to pending list), 'check_later' (retry next run)
    # UPCOMING/PREMIERE videos will have captions once they complete
    handle_upcoming: skip             # Skip UPCOMING/PREMIERE videos by default
    # Coverage threshold (US-004): videos below this ratio are flagged for transcription fallback
    # Coverage = sum of segment durations / video duration (0.0-1.0)
    min_coverage_threshold: 0.5       # Flag videos with <50% caption coverage
    # Format preference (US-006): order of subtitle formats to try
    # json3 is preferred by default since it's already structured (no conversion needed)
    # Falls back to next format on parse error or unavailability
    # Available formats: json3, srv3, vtt, srt
    preferred_formats: ["json3", "vtt", "srt"]
    # Adaptive format ordering (US-002 Sprint 7): reorder formats based on success rates
    # When enabled, formats with higher historical success rates are tried first
    # Success rates are persisted in caption cache for cross-run learning
    adaptive_format_order: true  # Use historical success rates to order formats
    # Caption availability pre-check (US-008): check if captions exist before fetching
    # This avoids wasted network calls for videos without captions
    # Uses --list-subs which is faster than downloading caption content
    pre_check_availability: true  # Pre-check caption availability before fetch
    # Timing validation epsilon (US-007 Sprint 6): tolerance for floating-point precision
    # Captions ending within this epsilon of video duration are treated as valid (not exceeding)
    # Example: 299.999s caption in 300s video is valid with 100ms epsilon
    # Set to 0 for exact matching (may cause false positives from float precision)
    timing_epsilon_ms: 100.0      # Timing tolerance in milliseconds (default: 100ms)
    # Cross-project cache validation (US-008 Sprint 6)
    # Validates cached caption data before use to prevent corrupt data propagation
    # Modes: 'strict' (reject on mismatch), 'warn' (re-fetch on failure), 'skip' (no validation)
    cache_validation: "warn"      # Validation mode (default: warn)
    cache_validation_tolerance: 0.2  # Max segment count deviation ratio (20%)

    # Total format timeout budget (US-67-003): maximum wall-clock seconds across ALL
    # subtitle format attempts per video. When cumulative time exceeds this budget,
    # remaining formats are skipped. Prevents wasting ~95s (45+25+25) per video when
    # no captions exist. Set to 0 to disable (unlimited time across formats).
    total_format_timeout_seconds: 60.0  # Max seconds across all format attempts per video

    # Negative cache TTL (US-63-005): how long to remember videos without captions
    # When a video is found to have no captions, this result is cached to avoid
    # repeated expensive lookups. TTL allows re-checking since captions may be added later.
    # Default: 3600 seconds (1 hour). Set to 0 to use max_cache_age_days for negative entries.
    negative_cache_ttl_seconds: 3600  # Negative cache TTL in seconds (default: 1 hour)

    # Per-category retry budgets (US-003 Sprint 7)
    # Maps error type to maximum retry attempts. Different errors need different strategies:
    # - network: Transient connectivity issues, retry aggressively
    # - timeout: Request timeouts, moderate retries
    # - parse: Content parsing failures, rarely succeed on retry
    # - unavailable: Video has no captions, never retry
    # - rate_limit: API rate limiting, retry with longer backoff
    retry_budgets:
      network: 3      # Network errors retry aggressively
      timeout: 2      # Timeouts get moderate retries
      parse: 1        # Parse errors rarely succeed on retry
      unavailable: 0  # Never retry - video has no captions
      rate_limit: 2   # Rate limits retry with backoff

    # Batch pre-check by channel (US-006 Sprint 7)
    # Groups videos by YouTube channel and uses representative samples to determine
    # caption availability for the entire channel, reducing API calls.
    # For example, 50 videos from the same channel might only need 5 actual checks
    # if the channel pattern indicates >90% confidence.
    batch_precheck_by_channel: true   # Enable channel-based batching
    batch_precheck_confidence: 0.9    # Min confidence to skip individual checks (0.0-1.0)
    batch_precheck_min_samples: 5     # Videos checked per channel before trusting pattern
    batch_precheck_sample_size: 5     # Videos to sample when building channel pattern
    # Channel-based fetch prioritization (US-009 Sprint 7)
    # When enabled, videos from channels with higher caption availability are fetched first.
    # This improves average success rate early in the batch and identifies problematic channels faster.
    prioritize_by_channel: true       # Fetch high-success channels first
    # Error pattern detection (US-007 Sprint 7)
    # When 30%+ of first N videos fail with the same error (e.g., 403 Forbidden),
    # detect the pattern and take action. Useful for early geoblocking detection.
    # Modes: 'abort' (stop immediately), 'warn' (log and continue), 'skip' (disable)
    abort_on_error_pattern: "warn"    # Action on error pattern detection (default: warn)
    error_pattern_threshold: 0.3      # Ratio of failures to trigger (30% = 3/10 videos)
    error_pattern_sample_size: 10     # Videos to check before evaluating patterns
    # Batch progress reporting interval (US-66-005)
    # Log batch-level progress every N videos processed.
    # Lower values = more frequent updates; higher values = less log noise.
    progress_report_interval: 25      # Log progress every 25 videos (default: 25)
    # Unavailable early termination threshold (US-66-005)
    # When this fraction of a rolling window of recent videos lack captions,
    # switch remaining videos to preflight-only mode (lighter check).
    unavailable_threshold: 0.8        # Switch at 80% unavailable in window (default: 0.8)
    # Rate limit backoff parameters (US-66-006)
    # Controls exponential backoff for rate-limited caption fetches.
    # Used by RateLimitState/RateLimitTracker in src/caption/timeout.py.
    rate_limit_base_backoff_seconds: 5.0    # Initial backoff delay (1st: 5s, 2nd: 10s, 3rd: 20s...)
    rate_limit_max_backoff_seconds: 300.0   # Maximum backoff cap (5 minutes)
    rate_limit_max_history: 10              # Recent rate limit events to track

    # Worker progress tracking (US-008 Sprint 8)
    # Time threshold for considering a worker "stuck" on a video.
    # Workers exceeding this threshold are reported in progress callbacks.
    stuck_worker_threshold: 60.0      # Seconds before worker is considered slow (default: 60s)

    # Caption circuit breaker (US-64-006): pause caption fetching after consecutive failures
    # Implements the circuit breaker pattern to prevent hammering YouTube API
    # when captions are genuinely unavailable or rate-limited.
    #
    # How it works:
    #   1. Tracks consecutive caption fetch failures
    #   2. After threshold failures, "trips" and pauses for pause_seconds
    #   3. On first successful fetch after pause, resets to normal
    circuit_breaker:
      enabled: true                     # Enable caption circuit breaker
      threshold: 5                      # Consecutive failures before tripping (default: 5)
      pause_seconds: 60.0               # Seconds to pause after tripping (default: 60)
      max_pause_seconds: 300.0          # Maximum pause cap (5 min)
      circuit_breaker_cascade: true     # Propagate trips to download circuit breaker

    # Batch retry budget (US-33-010, US-37-004, US-37-008, US-61-011)
    # Global limits for caption fetch attempts across entire batch.
    # When limits are exceeded, remaining videos fall back to transcription.
    retry_budget:
      enabled: true                   # Enable retry budget tracking
      max_attempts: 100               # Maximum total fetch attempts (0 = unlimited)
      max_backoff_time_seconds: 300.0 # Maximum cumulative backoff time (5 min)
      auto_scale: true                # Scale max_attempts based on batch size
      attempts_per_video: 2.0         # 2.0 = 1 attempt + 1 retry per video average
                                      # Only scales UP, never below max_attempts
      # VPN rotation on caption budget exhaustion (US-61-011)
      # When budget exhausts with >50% RATE_LIMIT errors, trigger VPN rotation
      # Requires download.mullvad.enabled: true to take effect
      vpn_rotation_on_caption_exhaustion: false  # Default: false (opt-in)
      max_vpn_resets_per_session: 2   # Max VPN-triggered budget resets to prevent loops
      # Early termination on low success rate (US-37-009)
      min_success_rate: 0.3           # Terminate early if success rate below 30%
      min_sample_for_early_termination: 20  # Check after 20 videos processed

  # Zero-download remix: auto-retry with alternative keywords when 0 results
  # When a keyword returns no videos, automatically try simplified/remixed terms
  zero_download_remix:
    enabled: true           # Enable automatic keyword remix on 0 results
    use_llm: false          # Use LLM for smart remix (costs API calls, slower)
                            # If false, uses simple heuristics (add "footage", simplify)

  # Speech screening: pre-screen videos by transcribing first N seconds
  # Filters out videos with talking heads/commentary to ensure only B-roll footage
  # Only applied to configured tiers (long videos are more likely to have intros)
  speech_screening:
    enabled: true           # Enable speech screening for long videos
    screening_duration: 10.0 # Seconds from start to check for speech (increased for better accuracy)
    min_speech_duration: 1.0 # Minimum speech duration to trigger rejection (stricter threshold)
    reject_with_speech: true # If true, reject videos with speech; if false, just log
    whisper_model: "base"   # Model for screening: tiny, base, small, medium, large
    timeout_per_video: 45   # Timeout per video screening (seconds) - increased for 10s clips
    fallback_on_error: "accept"  # "accept" or "reject" on screening errors
    tiers:                  # Only apply to these duration tiers
      - "long"              # 10-25 min videos
      - "longer"            # 25-50 min videos

  # Cookie rotation: rotate between multiple cookie files on rate limit
  # When YouTube returns 429 or requires sign-in, automatically switch to a different
  # cookie file. Each cookie should be exported from a different browser profile/account.
  cookie_rotation:
    enabled: false          # Enable cookie rotation (requires multiple cookie files)
    cookie_files:           # List of cookie file paths to rotate through
      - "cookies/main.txt"
      - "cookies/backup1.txt"
      - "cookies/backup2.txt"
    rotation_strategy: "on_error"  # on_error, round_robin, or random
    rotate_on_errors:       # Error patterns that trigger rotation
      - "429"
      - "rate limit"
      - "too many requests"
      - "403"
      - "forbidden"
      - "sign in"
      - "login required"
      - "confirm your age"
      - "bot detection"
    cooldown_seconds: 300   # Wait 5 min before reusing a rotated-out cookie
    max_rotations_per_session: 0  # 0 = unlimited

  # Cookie method fallback (automatic, no config needed):
  # When retries exhaust on auth/rate-limit errors, the pipeline automatically
  # falls back through cookie methods built from the settings above:
  #   [browser:<cookies_from_browser>] → [file:<cookie_files[0]>] → ... → [no-cookies] → GIVE UP
  # Each method gets its own full set of retries. On success, the working method
  # is remembered as the starting point for subsequent downloads.

  # Rate limit backoff: progressive delay before cookie rotation
  # When rate limit errors occur, apply exponential backoff BEFORE escalating to
  # cookie rotation. This handles brief rate-limit windows without exhausting cookies.
  #
  # Backoff sequence example (with defaults):
  #   1st rate limit: wait 5s
  #   2nd rate limit: wait 10s (total: 15s)
  #   3rd rate limit: wait 20s (total: 35s)
  #   4th rate limit: wait 25s (total: 60s) -> rotate cookie
  rate_limit:
    initial_backoff_seconds: 5.0   # Initial delay on first rate limit error
    max_backoff_before_rotate: 60.0  # Max cumulative delay before rotating cookie
    backoff_multiplier: 2.0        # Exponential backoff multiplier
    # Cross-session cooldown: minutes to wait before assuming rate limit cleared
    # If resuming within this period, start with recovery mode (longer delays,
    # faster escalation to cookie/VPN rotation)
    resume_cooldown_minutes: 15.0
    # Per-tier isolation: track rate limit state separately for each duration tier
    # When true, rate limit on 'long' tier won't affect 'short' tier backoff
    per_tier_isolation: true
    # Cross-keyword budget sharing: track rate limit recovery resources across keywords
    # When true, if keyword A exhausts rotations, keyword B skips directly to VPN
    share_budget_across_keywords: true
    # Maximum total backoff time budget per session (seconds)
    # After this much total backoff, skip backoff and escalate immediately
    # 0 = unlimited
    max_backoff_budget: 300.0  # 5 minutes
    # Adaptive backoff multiplier: adjust multiplier based on error severity (US-008)
    # When true, backoff_multiplier is adjusted based on error patterns:
    #   - low severity (sign in, login required): 1.5x multiplier
    #   - medium severity (429, too many requests): 2.0x multiplier (default)
    #   - high severity (quota exceeded, bot detection): 3.0x multiplier
    adaptive_multiplier: true

  # VPN integration: switch VPN servers when cookies are exhausted
  # Requires a VPN client with CLI support (NordVPN, ExpressVPN, Mullvad, etc.)
  vpn:
    enabled: false          # Enable VPN switching
    switch_command: ""      # Command to switch VPN server, e.g., "nordvpn connect random"
    disconnect_command: ""  # Optional: command to disconnect, e.g., "nordvpn disconnect"
    rotate_on_rate_limit: true  # Switch VPN on rate limit (after cookies exhausted)
    switch_delay_seconds: 10    # Wait for VPN connection after switch
    max_switches_per_session: 10  # Limit VPN rotations (0 = unlimited)
    verify_connection: true     # Verify connectivity after switch
    verify_timeout: 30          # Timeout for connection verification
    # Configurable verification endpoints (US-010)
    # For privacy-conscious users who don't want verification pinging Google
    skip_verification: false    # Skip verification entirely (true = no ping/curl check)
    verification_endpoint: "https://www.google.com"  # HTTPS endpoint for curl check
    # Alternatives: "https://cloudflare.com", "https://1.1.1.1"
    verification_ip: "8.8.8.8"  # IP for ping fallback (Google DNS)
    # Alternatives: "1.1.1.1" (Cloudflare), "208.67.222.222" (OpenDNS)

  # Mullvad VPN: Tier 4 escalation - IP rotation via Mullvad CLI
  # Triggers when cookie rotation (Tier 3) is exhausted.
  # Requires Mullvad VPN client: winget install Mullvad.Mullvad
  # Verification uses am.i.mullvad.net API to confirm Mullvad exit IP.
  mullvad:
    enabled: false                        # Enable Mullvad VPN as Tier 4 (opt-in)
    preferred_countries: ['us', 'gb', 'de', 'nl']  # Server locations to rotate through
    rotation_strategy: 'random'           # 'random', 'sequential', or 'nearest'
    max_rotations_per_session: 5          # Limit VPN rotations per run
    verification_timeout: 10              # Timeout (seconds) for am.i.mullvad.net check
    rotation_delay_seconds: 5             # Delay after rotation before retrying download
    # VPN switch budget settings (inherited from base VPN)
    max_vpn_switches: 10                  # Max VPN server switches per session
    switch_delay_seconds: 5               # Delay between switches
    min_switch_interval: 60               # Minimum seconds between VPN switches

  # Speed tracking: monitor download speeds for adaptive timeouts
  # Tracks actual download speeds and adjusts timeouts dynamically based on
  # network conditions. On slow networks, timeouts can be extended up to 2x.
  #
  # How it works:
  #   1. Records bytes downloaded and time for each video
  #   2. Tracks sliding window of last 5 downloads
  #   3. If avg speed < min_speed_mbps, extends timeout proportionally
  #   4. State is persisted in checkpoint for resume scenarios
  speed_tracking:
    enabled: true              # Enable speed monitoring
    window_size: 10            # Number of downloads to track for running average (US-61-004)
    min_speed_mbps: 1.0        # Below this, timeout gets extended (MB/s)
    max_timeout_multiplier: 2.0  # Maximum timeout extension (2x)
    enable_adaptive_timeout: true  # Auto-extend timeouts on slow networks
    safety_factor: 1.5         # Multiplier for adaptive timeout calculation (US-61-004)
    # Rate limit signal detection (US-002)
    # When downloads slow to near-stalled speeds, signals potential rate limiting
    # before hard errors occur. Triggers preemptive backoff via circuit breaker.
    rate_limit_signal_threshold: 0.1  # MB/s - near-stalled threshold (100 KB/s)
    consecutive_slow_samples: 3       # Slow samples before triggering signal

  # Circuit breaker: pause searches after consecutive failures
  # Implements the circuit breaker pattern to prevent hammering YouTube
  # when multiple keywords fail in a row (e.g., during rate limiting).
  #
  # How it works:
  #   1. Tracks consecutive search failures (no results or errors)
  #   2. After threshold failures, "trips" and pauses for pause_seconds
  #   3. On first successful search after pause, resets to normal
  circuit_breaker:
    enabled: true                       # Enable circuit breaker
    consecutive_failures_threshold: 5   # Failures before tripping (default: 5)
    pause_seconds: 60.0                 # Seconds to pause after tripping (default: 60)
    block_download_retries: true        # Block download retries when circuit breaker tripped
                                        # When true, the download retry loop waits for circuit
                                        # breaker recovery before attempting the next retry.
                                        # This prevents retries during active rate limiting.
    max_pause_seconds: 300.0            # Maximum pause duration cap (seconds). Prevents
                                        # budget-aware scaling from creating excessively long
                                        # pauses. Default: 300 (5 minutes).

  # Batch retry queue for rate-limited videos
  # When rate limiting affects a batch, collect failed videos and retry them
  # together after a delay. More effective than individual retries because it
  # allows the rate limit window to pass before attempting the batch.
  #
  # How it works:
  #   1. Video fails due to rate limit → added to retry queue
  #   2. After batch completes, wait delay_seconds
  #   3. Retry all queued videos together (pass 1)
  #   4. If still failing, wait and retry again (up to max_passes)
  batch_retry:
    enabled: true                       # Enable batch retry queue
    delay_seconds: 120.0                # Delay before retry (default: 120s = 2 min)
    max_passes: 2                       # Maximum retry passes (default: 2)
    max_retries_per_video: 3            # Max retries per individual video across restarts (default: 3)
                                        # Videos exceeding this are permanently skipped
    respect_circuit_breaker: true       # Wait for circuit breaker recovery before retry
                                        # When true, if circuit breaker is tripped, batch retry
                                        # waits for it to recover before processing the queue
    wait_for_cookie_cooldown: true      # Wait for cookie cooldown expiry before retry
    max_combined_wait_seconds: 300.0    # Max total wait when both CB and cooldown block
                                        # If exceeded, force retry with best-available cookie

  # Browser impersonation: spoof TLS fingerprints to bypass YouTube bot detection
  # Uses curl_cffi to impersonate real browser TLS ClientHello signatures.
  # Always-on by default (Tier 1): every yt-dlp call uses --impersonate with
  # a round-robin rotated target from Chrome, Firefox, Safari, Edge, etc.
  #
  # Available targets are auto-detected at startup via:
  #   yt-dlp --list-impersonate-targets
  #
  # curl_cffi 0.13.0 provides ~31 targets (Chrome, Firefox, Safari, Edge, Tor).
  # See src/downloader/impersonation.py for ImpersonationManager details.
  impersonation:
    enabled: true               # Enable browser impersonation on all yt-dlp calls
    preferred_targets: []       # Filter to specific targets (empty = use all detected)
                                # Example: ["Chrome-136:Macos-15", "Safari-18.0:Ios-18.0"]
    detect_at_startup: true     # Auto-detect targets via --list-impersonate-targets
    detection_timeout: 10       # Timeout for detection subprocess (seconds)

  # Extractor args escalation: Tier 2 bypass for YouTube bot detection
  # When Tier 1 (impersonation) fails repeatedly with 403 errors, escalate by
  # adding --extractor-args "youtube:player_client=<client>" to yt-dlp commands.
  #
  # 3-Tier escalation progression:
  #   Tier 1: --impersonate only (always-on, handled by ImpersonationManager)
  #   Tier 2: --impersonate + --extractor-args player_client (this config)
  #   Tier 3: Both + cookie rotation (handled by CookieRotator)
  #
  # Player clients are rotated round-robin per keyword on each Tier 2+ call.
  # See src/downloader/escalation_manager.py for EscalationManager details.
  extractor_args:
    enabled: true               # Enable Tier 2 extractor-args escalation
    player_clients:             # Player client values to rotate at Tier 2
      - web_safari              # Safari web client
      - tv_downgraded           # Downgraded TV client (good for bypasses)
      - web                     # Standard web client
      - ios                     # iOS mobile client
      - android_vr              # Android VR client
    escalation_threshold: 2     # Consecutive 403s before escalating to next tier
    cooldown_seconds: 300.0     # Seconds before de-escalating back to lower tier
    max_tier: 3                 # Maximum tier (1=impersonate, 2=extractor-args, 3=full bypass)
    de_escalation_enabled: true # Drop tier on sustained success (US-61-006)
    de_escalation_threshold: 5  # Consecutive successes needed to de-escalate by 1 tier

  # Cross-keyword rate limit budget: shared resource limits across all keywords
  # When one keyword exhausts rotations, other keywords skip directly to VPN
  rate_limit_budget:
    enabled: true               # Enable cross-keyword budget sharing
    max_rotations: 10           # Max cookie rotations per session (0 = unlimited)
    max_backoff_time: 600.0     # Max total backoff seconds per session (0 = unlimited)
    max_vpn_switches: 3         # Max VPN switches per session (0 = unlimited)
    auto_scale_budget: true     # Scale budget limits by keyword count (ceil(n/5), max 5x)

  # Segment download settings (DOWNLOAD_SEGMENTS stage)
  # Delay between segment download requests (seconds). Prevents YouTube rate-limiting.
  # Adaptive: doubles after each failure (capped at segment_request_delay_max), resets on success.
  segment_request_delay: 1.0
  # Maximum adaptive delay after consecutive failures (seconds)
  segment_request_delay_max: 30.0
  # Buffer seconds to add before/after each matched segment for editing flexibility
  segment_buffer: 5.0
  # yt-dlp format string for segment downloads (use {segment_max_resolution} placeholder)
  segment_format: "best[height<={segment_max_resolution}]"
  # Maximum video resolution (height in pixels) for segment downloads
  segment_max_resolution: 1080
  # Socket timeout for segment downloads (seconds). 0 = use main socket_timeout value.
  segment_socket_timeout: 0
  # Stall timeout for segment downloads (seconds). Wraps ydl.download() in a
  # ThreadPoolExecutor to detect hangs where the call blocks indefinitely
  # (e.g., ffmpeg post-processing stalls, stream-level hangs with no data flow).
  # Unlike socket_timeout (HTTP sockets only), this covers the entire download
  # including ffmpeg merging/remuxing. 0 = no stall detection.
  segment_stall_timeout: 120

  # Bot-detection tier floor: after N consecutive 403/bot-detection errors across
  # ALL video IDs (stage-level), new downloads start at max escalation tier instead
  # of Tier 1. Prevents wasting time on Tier 1 when YouTube is broadly blocking.
  # Resets on any successful download. 0 = disabled.
  bot_detection_tier_floor_threshold: 5

  # Bot-detection abort threshold: after N total bot-detection errors across all
  # videos in the stage, abort the download loop entirely. Prevents running through
  # every remaining segment when YouTube is broadly blocking. Progress is checkpointed
  # before aborting so --resume picks up where it left off. 0 = disabled.
  bot_detection_abort_threshold: 10

  # Network failure threshold: consecutive network failures (DNS, connection refused,
  # etc.) before aborting the download loop. Indicates systemic network issues that
  # won't resolve by retrying more videos. Resets on any successful download.
  network_failure_threshold: 3

  # FFmpeg location (required for segment downloads if not in PATH)
  # Example: "C:/ffmpeg/bin" or leave empty to auto-detect
  ffmpeg_location: "C:/ffmpeg/bin"

  # Retry settings for failed downloads
  # When a video/audio download fails, retry with exponential backoff
  # Useful for handling temporary network issues or rate limiting
  max_retries: 6          # Maximum retry attempts per video (default: 3, increased for SABR stalling)
  retry_delay: 2.0        # Base delay between retries in seconds (default: 2.0)
  retry_backoff: 2.0      # Exponential backoff multiplier (default: 2.0)
                          # Example: 3 retries with delay=2, backoff=2 → waits 2s, 4s, 8s

  # Parallel download settings
  # Number of concurrent downloads to run simultaneously
  # Higher values = faster downloads but more bandwidth/CPU usage
  # Note: Currently sequential, this setting is prepared for future parallel support
  parallel_workers: 4     # Concurrent download workers (1-8 recommended)

# -----------------------------------------------------------------------------
# DURATION TIERS
# -----------------------------------------------------------------------------
# Chain-of-thought: Different video lengths serve different purposes
# Reasoning: Short clips for quick cuts, long for extended coverage

duration_tiers:
  short:
    min: 20
    max: 120
    count: 0            # Disabled - focusing on medium/long videos
    max_total: 0        # 0 = no limit
  medium:
    min: 120
    max: 600
    count: 10            # Increased from 3
    max_total: 0
  long:
    min: 600
    max: 1500
    count: 0            # Increased from 1
    max_total: 0
  longer:
    min: 1500
    max: 3000
    count: 0            # Increased from 1
    max_total: 0        # Removed limit - allow multiple longer videos

# -----------------------------------------------------------------------------
# STOCK FOOTAGE (Pexels, Pixabay)
# -----------------------------------------------------------------------------
stock_footage:
  enabled: true
  pexels_enabled: true
  pixabay_enabled: true
  per_keyword: 3
  min_duration: 5
  max_duration: 60
  min_height: 720
  prefer_landscape: true
  <<: *rate_limit

# -----------------------------------------------------------------------------
# SILENT VIDEO HANDLING (B-ROLL)
# -----------------------------------------------------------------------------
# Chain-of-thought: Silent videos (no speech) are valuable B-roll footage
# Reasoning: They're versatile visual content without talking heads
# Decision: Generate descriptions using Vision API or LLM for matching
silent_video:
  enabled: true  # Enable silent video handling
  min_words_threshold: 10  # Videos with fewer words are considered silent
  use_vision_api: true  # Use Gemini Vision to describe video frames
  use_llm_fallback: true  # Fall back to LLM description from title/keyword
  cache_descriptions: true  # Cache generated descriptions

# -----------------------------------------------------------------------------
# DEDUPLICATION
# -----------------------------------------------------------------------------
# Chain-of-thought: Perceptual hashing detects near-duplicate videos
# Reasoning: Saves storage, prevents redundant processing
# Decision: threshold=10 balances precision vs recall

deduplication:
  enabled: true
  hash_threshold: 10  # Hamming distance (0-64, lower = stricter)
  use_first_frame: true
  auto_delete: true
  generate_report: true
  frame_timeout: 30   # Seconds for FFmpeg frame extraction

# -----------------------------------------------------------------------------
# OUTPUT GENERATION
# -----------------------------------------------------------------------------
# Chain-of-thought: Multiple tracks give editors options
# Reasoning: V1-V3 alternatives, V4-V8 strategies
# Decision: Enable all by default, let editors disable unused

output:
  output_dir: output
  
  # File formats
  generate_otio: true
  split_otio: true  # Split OTIO into multiple files by clip batches
  otio_clips_per_file: 10  # Max clips per OTIO file (lower = smaller files, easier import)
  generate_edl: true
  generate_xml: true  # DaVinci Resolve XML (fallback if OTIO fails)
  xml_parts: 6  # Split XML into multiple files (helps with large projects)
  generate_report: true
  quality_report_enabled: true  # Generate quality_report.json with match quality metrics

  # Voiceover alignment offset (seconds)
  # Use this to fix alignment when SRT timestamps don't match the actual audio
  # Positive = shift clips later (audio is ahead of SRT timing)
  # Negative = shift clips earlier (audio is behind SRT timing)
  # Example: If audio starts 0.5s before SRT says it does, use -0.5
  voiceover_offset: 0.0

  # Gap threshold (seconds) - collapse gaps smaller than this value
  # Whisper often inserts small gaps (~0.5-0.8s) between segments that don't exist in audio
  # Setting to 1.0 will place clips back-to-back for gaps under 1 second
  # Set to 0.0 to preserve all gaps from SRT (default)
  min_gap_threshold: 0.0

  # Time scale factor - stretch SRT timestamps to match actual audio duration
  # Useful when Whisper compresses timestamps (common issue with long audio)
  # Values:
  #   0.0 = AUTO: Calculates actual_audio_duration / srt_last_segment_end
  #   1.0 = No scaling (default)
  #   Other = Manual scale (e.g., 1.065 stretches timeline by 6.5%)
  time_scale_factor: 1.0

  # Gap distribution mode - how to handle gaps/pauses between voiceover segments
  # Controls how silence is placed between clips in the timeline
  # Options:
  #   "scale" (default): Scale SRT gaps by time_scale_factor - trusts SRT gap timing
  #   "proportional": Recalculate gaps based on actual audio duration
  #                   Distributes total gap time proportionally based on original SRT gap ratios
  #                   Use when Whisper's gap timing is inaccurate but segment durations are good
  #   "none": No gaps between clips, back-to-back placement
  #           Useful when SRT gaps are completely wrong or you want continuous clips
  #   "extend": Extend previous clip duration to fill gaps (max 2x original duration)
  #             Creates continuous flow by stretching clips instead of inserting silence
  #             Good for B-roll or when you want to minimize empty space on timeline
  gap_mode: "scale"

  # Track structure
  # V1: Primary, V2-V3: Alternatives
  # V4-V6: Secondary (different video files from V1-V3)
  # V7: Embedding-Diversity strategy
  num_alternatives: 2  # V2-V3
  include_strategy_tracks: true
  strategy_tracks:
    - embedding_diversity  # V7 - maximally different clips from V1-V3
    - broll_only           # V8 - B-roll only matching (silent footage)
  
  # Variety enforcement - prevents same source video from dominating timeline
  # This solves the problem of one video being used for 90% of a 30-minute project
  variety:
    require_different_source: true  # Each track must use different source video
    exclude_same_clip: true  # Never use exact same clip on multiple tracks
    min_time_distance: 10.0  # Clips must be N seconds apart (within same source)
    min_embedding_distance: 0.3  # Strategy tracks must have distance > this from V1-V3
    
    # Timeline variety - IMPORTANT for long projects
    # Within timeline_variety_window seconds, same source can only appear max_repeats times
    enforce_timeline_variety: true  # Enable timeline-based variety enforcement
    timeline_variety_window: 300.0  # 5 minutes - no same source within this window
    max_source_repeats_in_window: 2  # Max times same source can appear in window
  
  # Markers
  include_speed_markers: true
  max_recommended_speed: 1.5

# -----------------------------------------------------------------------------
# MULTI-STYLE OUTPUT
# -----------------------------------------------------------------------------
multi_style:
  enabled: false
  styles:
    - default
    - strict

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Chain-of-thought: Comprehensive logging aids debugging and auditing
# Reasoning: Dual output (file + JSON) for human and machine consumption
# Decision: Track API costs for budget management

logging:
  enabled: true
  log_dir: logs
  log_level: INFO  # DEBUG, INFO, WARNING, ERROR
  
  # Output targets
  log_to_file: true
  log_to_console: true
  generate_json_log: true
  
  # Log content
  log_api_calls: true
  log_match_decisions: true
  log_performance: true
  
  # Cost tracking
  track_api_costs: true
  
  # Config debugging
  # Chain-of-thought: Enable to debug which config values are accessed
  log_config_access: false
  warn_on_hardcoded: true

# -----------------------------------------------------------------------------
# CACHE
# -----------------------------------------------------------------------------
cache:
  cache_dir: .cache
  
  # Per-type caching
  cache_transcriptions: true
  cache_embeddings: true
  cache_scenes: true
  cache_llm_responses: true
  cache_vision: true
  
  # Cross-project cache
  cross_project_cache: false
  cross_project_cache_dir: ""
  
  # Validation
  validate_cache_on_load: true
  use_file_hash: true

# -----------------------------------------------------------------------------
# GLOBAL CACHE (Cross-Project Video Reuse)
# -----------------------------------------------------------------------------
# Enables sharing of video cache (transcripts, embeddings, scenes) across
# multiple projects. Videos from past projects can be reused if they match
# the current project's keywords/topics.
#
# Key features:
# - Pre-download check: Find relevant videos before downloading new ones
# - Smart re-download: Re-add deleted videos to download queue
# - Priority system: Current project videos always take precedence

global_cache:
  enabled: true
  cache_dir: "~/.matcher_global_cache"  # ~ expands to home directory

  # Pre-download optimization
  check_before_download: true   # Query cache before downloading new videos
  redownload_deleted: true      # Re-download if cached video file was deleted
  prompt_reuse: true            # Ask user before reusing (false = auto-reuse)

  # Relevance thresholds
  min_keyword_similarity: 0.8   # Fuzzy match threshold for keywords (0-1)
  min_topic_overlap: 0.3        # Minimum topic relevance to consider video (0-1)

  # Limits
  max_reuse_videos: 50          # Max videos to reuse from cache per project
  max_redownload: 10            # Max deleted videos to re-download

  # What to share globally
  share_transcripts: true       # Share video transcripts across projects
  share_embeddings: true        # Share embedding vectors across projects
  share_scenes: true            # Share scene detection data across projects
  share_face_detection: true    # Share face detection scores across projects

  # Priority boost for current project videos in matching
  current_project_boost: 0.1    # How much to boost current project videos (0-1)

# -----------------------------------------------------------------------------
# PIPELINE AUTOMATION
# -----------------------------------------------------------------------------
# Skip stages to re-run pipeline with existing data.
# Useful for: re-matching with different settings, testing output formats, etc.

pipeline:
  # Stage control (set true to skip that stage)
  skip_download: false        # Skip video download - use existing videos
  skip_image_search: false    # Skip entity image search
  skip_transcription: false   # Skip transcription - use cached transcripts
  skip_scene_detection: false # Skip scene detection
  skip_matching: false        # Skip matching stage
  
  # Video source directory (used when skip_download=true)
  # Set to absolute path containing your videos, e.g.:
  # video_source_dir: "E:/Edit Job/test/project/downloaded_videos"
  video_source_dir: ""
  
  # Resume/retry
  resume_enabled: true
  max_retries: 3

  # Checkpoint backup rotation (US-51-007)
  # Number of rotated backup files: checkpoint.backup.json, .backup.1.json, .backup.2.json
  checkpoint_backup_count: 3

  # Parallel processing
  parallel_transcription: true
  parallel_embedding: true

# -----------------------------------------------------------------------------
# SELF-HEALING PIPELINE
# -----------------------------------------------------------------------------
# Automatic error recovery during pipeline execution.
# Healers detect specific error categories and attempt automatic fixes.
#
# Available strategies:
#   - aggressive: Try all fixes, modify config freely (max 5 attempts/stage)
#   - conservative: Safe fixes only, preserve config (default, 3 attempts)
#   - interactive: Ask user before major changes
#   - minimal: Only critical fixes, fail fast (1 attempt)
#   - overnight: Unattended batch processing, max resilience (8 attempts/stage)
#   - development: Fast failures, no auto-fix, verbose debugging (1 attempt)
#   - production: Balanced resilience + efficiency (4 attempts/stage)
#
# Healers:
#   - CheckpointHealer: Corrupt checkpoint recovery
#   - APIHealer: Rate limits, auth errors, provider fallback
#   - DownloadHealer: YouTube errors, unavailable videos
#   - DiskHealer: Disk space, permission issues
#   - PathHealer: Windows path length, unicode issues
#   - OTIOHealer: Timeline generation, gaps, duration, exports

healing:
  enabled: true              # Enable self-healing pipeline
  strategy: "conservative"   # aggressive, conservative, interactive, minimal, overnight, development, production
  max_attempts_per_stage: 3  # Max heal attempts per stage
  max_total_heals: 20        # Max total heals before giving up
  heal_delay: 2.0            # Seconds between heal attempts
  run_preflight: true        # Run preflight checks before pipeline
  auto_fix_preflight: true   # Auto-fix issues found in preflight
  enable_rollback: true      # Enable config rollback on failure
  print_report: true         # Print healing report after pipeline

  # Healing-specific logging
  logging:
    enabled: true
    log_dir: "logs"          # Relative to project dir
    json_log: true           # Machine-parseable JSON logs
    console_format: "box"    # "box", "simple", "minimal"
    include_prompts: false   # Include full LLM prompts (verbose)
    include_responses: false # Include full LLM responses (verbose)

  # Watcher LLM (local Ollama for fast error classification)
  # The watcher classifies errors and routes to appropriate healers
  watcher:
    enabled: true
    provider: "ollama"           # ollama, anthropic, gemini
    model: "llama3.2"            # Local model for fast triage
    fallback_model: "llama3.1"   # Try if primary unavailable
    host: "http://localhost:11434"
    timeout: 30.0                # Max time for classification (seconds)
    escalate_threshold: 0.7      # Confidence below this escalates to LLM healer
    max_failures: 3              # Disable after N consecutive failures
    recheck_interval_seconds: 300.0  # Re-check availability every 5 min
    warmup_on_preflight: false   # Pre-warm model during preflight (disable if Ollama not running)

  # LLM Healer (Claude for complex error analysis)
  # Used when standard healers fail and watcher recommends escalation
  llm_healer:
    enabled: true
    provider: "anthropic"        # anthropic, gemini, ollama
    model: "claude-sonnet-4-20250514"  # Cost-effective for debugging
    max_tokens: 4096
    timeout: 60.0
    max_retries: 3               # Self-heal retries before giving up
    include_stack_trace: true    # Include stack trace in context
    include_config_context: true # Include relevant config in context
    include_file_snippets: true  # Include code snippets in context
    max_snippet_lines: 50        # Max lines of code per snippet
    max_context_chars: 12000     # Max chars for LLM context (~3000 tokens)
    recheck_interval_seconds: 300.0
    max_failures: 3

# -----------------------------------------------------------------------------
# B-ROLL DOWNLOAD AND MATCHING - DEPRECATED in v4.0
# -----------------------------------------------------------------------------
# NOTE: The BROLL_DOWNLOAD and BROLL_MATCH stages are no longer used in the
# simplified 7-stage pipeline. B-roll handling now relies on caption quality
# scoring in the MATCH stage. This section is kept for backward compatibility.
#
# Two new stages for improved B-roll handling:
# 1. BrollDownloadStage: Downloads videos specifically searched as B-roll
# 2. BrollMatchStage: Matches silent scenes to voiceover for V8 track
#
# B-roll detection is scene-level (not video-level):
# - Scenes with < min_words_threshold are considered B-roll
# - Both face-detection B-roll and silent B-roll appear in V8

broll:
  enabled: true                  # Enable B-roll stages

  # === Download stage (BrollDownloadStage) ===
  download_enabled: true         # Enable dedicated B-roll search
  downloads_per_term: 3          # Videos per search term
  max_total_downloads: 30        # Cap on total B-roll downloads
  duration_tier: "short"         # "short" (<3min) or "medium" (3-10min)
  include_generic_searches: true # Include "stock footage compilation" etc.
  search_suffixes:               # Terms appended to keywords
    - "b-roll"
    - "footage"
    - "cinematic"

  # === Detection (scene-level) ===
  min_words_threshold: 10        # Scenes with fewer words = B-roll
  ignore_markers:                # Don't count these as words
    - "[Music]"
    - "[Applause]"
    - "[Silence]"

  # === Vision API enrichment ===
  vision_enabled: true           # Use Vision API (auto-disabled in audio-first)
  vision_prompt: "detailed"      # "brief", "detailed", "keywords_only"
  frames_per_scene: 3            # Sample start/mid/end frames
  cache_descriptions: true       # Cache in .cache/broll_vision/
  vision_fallback_to_keywords: true  # Use filename keywords if Vision fails

  # === Scoring weights (should sum to 1.0) ===
  embedding_weight: 0.4          # Vision/filename description similarity
  keyword_weight: 0.35           # Keyword overlap score
  entity_weight: 0.25            # Entity name matching
  source_boost:                  # Priority boost by source
    youtube: 0.1                 # YouTube B-roll preferred
    pexels: 0.05                 # Stock footage secondary
    pixabay: 0.0                 # No boost for Pixabay

  # === Matching behavior ===
  min_match_score: 0.3           # Threshold for "good" match
  always_match: true             # Always pick best B-roll (V8 never empty)
  max_matches_per_segment: 3     # Top N options per voiceover segment

  # === Long video handling ===
  long_video_threshold: 600      # Videos > 10 min use sampling
  sample_interval_seconds: 120   # 1 scene per 2 minutes
  max_scenes_per_video: 15       # Cap on sampled scenes

# -----------------------------------------------------------------------------
# ITERATIVE MATCHING (Multi-Pass Gap Filling)
# -----------------------------------------------------------------------------
# Chain-of-thought: Initial matching often leaves gaps (low confidence segments)
# Reasoning: Multi-pass iteration with smart strategies fills gaps more effectively
# Decision: Target 90%+ confidence, enforce 5-minute source spacing for variety
#
# Algorithm per pass:
# 1. Identify gaps (conf < target OR source spacing violation) and locks
# 2. If gaps < 5%: stop (success!)
# 3. Analyze gap patterns for smarter search (abstract, proper noun, action, etc.)
# 4. Generate queries using multiple strategies
# 5. YouTube search + caption fetch for new candidates
# 6. Re-match ONLY gap segments with expanded pool
# 7. Track successful strategies -> learning DB
# 8. Merge locked (unchanged) + updated gaps
# 9. Repeat until max_iterations

iterative_matching:
  enabled: true                    # Enable iterative gap filling
  target_confidence: 0.90          # Lock segments above this (90%)
  source_spacing_seconds: 300      # Same source only once per 5 minutes

  # === Iteration control ===
  max_iterations: 5                # Maximum passes to attempt
  min_gap_percentage: 0.05         # Stop if fewer than 5% gaps
  no_progress_min_pass: 3          # Min pass before stopping on zero progress

  # === Search settings ===
  search_results_per_gap: 10       # YouTube results per gap query
  max_new_videos_per_pass: 50      # Cap on new videos per iteration

  # === Multi-strategy search ===
  use_voiceover_text_queries: true # Extract keywords from gap text
  use_similar_to_locked: true      # Find videos like successful matches
  use_entity_topic_queries: true   # Use entities and topics in queries
  parallel_strategy_search: true   # Run strategies concurrently

  # === Progressive refinement (passes 2+) ===
  enable_progressive_refinement: true
  refinement_synonyms: true        # Add synonyms to failing queries
  refinement_broaden_scope: true   # Remove specific terms

  # === Gap pattern analysis ===
  analyze_gap_patterns: true       # Classify gaps for smarter search
  gap_pattern_categories:
    - abstract_concept             # Hard to visualize: freedom, love
    - proper_noun                  # Names, places, brands
    - action_verb                  # Visual actions: running, cooking
    - location                     # Geographic references
    - emotion                      # Sentiment-heavy content

  # === Query learning (cross-project improvement) ===
  enable_query_learning: true      # Learn from successful queries
  learning_db_path: ".cache/query_learning.json"

  # === Caption settings ===
  fetch_captions_for_new_videos: true
  caption_timeout: 30              # Seconds per caption fetch
  caption_batch_size: 10           # Fetch captions in batches to avoid overwhelming the pipeline
  caption_fetch_delay: 0.5         # Delay between caption fetches to avoid rate limiting (seconds)

  # === Logging ===
  log_pass_summaries: true         # Log summary after each pass
  store_strategy_metrics: true     # Track per-strategy effectiveness

# -----------------------------------------------------------------------------
# API KEYS
# -----------------------------------------------------------------------------
# Chain-of-thought: API keys should be in environment variables
# Reasoning: Security - don't commit secrets to version control
# Decision: Document required keys here, load from env vars
#
# Required environment variables:
#   GEMINI_API_KEY      - Google Gemini (LLM, embeddings, vision)
#   ANTHROPIC_API_KEY   - Anthropic Claude (secondary LLM)
#   VOYAGE_API_KEY      - Voyage AI (alternative embeddings)
#   PEXELS_API_KEY      - Pexels stock footage
#   PIXABAY_API_KEY     - Pixabay stock footage
#   UNSPLASH_API_KEY    - Unsplash images
#
# api_keys section is auto-populated from environment variables at runtime